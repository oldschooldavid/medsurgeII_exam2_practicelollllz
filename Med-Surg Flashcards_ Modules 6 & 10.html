<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f6f8;--card:#fff;--ink:#1c2733;--mute:#66758a;--line:#dbe2ea;--acc:#1f7a8c;--accb:#e3f2f5;--ok:#2e8b57;--okb:#e2f4ea;--bad:#c2412d;--badb:#fbe9e5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10171e;--card:#1a232d;--ink:#e8eef4;--mute:#92a1b3;--line:#2c3a48;--acc:#5cc0d3;--accb:#183a43;--ok:#5fcf91;--okb:#17352a;--bad:#ff8a73;--badb:#3d211c}}
:root[data-theme="dark"]{--bg:#10171e;--card:#1a232d;--ink:#e8eef4;--mute:#92a1b3;--line:#2c3a48;--acc:#5cc0d3;--accb:#183a43;--ok:#5fcf91;--okb:#17352a;--bad:#ff8a73;--badb:#3d211c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:4px 0 12px;display:flex;justify-content:space-between;align-items:center}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
button,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer}
button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
select{flex:1;min-width:140px}
.tabs button{flex:1}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:6px 0 4px}
.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
.meta{display:flex;justify-content:space-between;color:var(--mute);font-size:13px;margin-bottom:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;min-height:300px;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.tag{display:inline-block;font-size:12px;color:var(--acc);background:var(--accb);border-radius:20px;padding:2px 10px;margin-bottom:10px}
.q{font-weight:600;margin:0 0 12px}
.opt{border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:6px 0;display:flex;gap:10px}
.opt b{color:var(--mute);text-transform:uppercase}
.opt.right{background:var(--okb);border-color:var(--ok)}
.hint{color:var(--mute);font-size:13px;text-align:center;margin-top:14px}
.ans{font-weight:700;color:var(--ok);margin:4px 0 10px}
.rat{margin:0 0 10px}.topic{color:var(--mute);font-size:13px}
.nav{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}
.nav .k{background:var(--okb);border-color:var(--ok)}.nav .r{background:var(--badb);border-color:var(--bad)}
.empty{text-align:center;color:var(--mute);padding:60px 10px}

<script>
const DATA=[{"module": 6, "ch": 16, "chTitle": "Concepts of Inflammation and Immunity", "num": 1, "type": "Multiple Choice", "q": "The nurse learns that the most important function of inflammation and immunity is which purpose?", "opts": [["a", "Destroying bacteria before damage occurs"], ["b", "Preventing any entry of foreign material"], ["c", "Providing maximum protection against infection"], ["d", "Regulating the process of self-tolerance"]], "ans": ["c"], "rat": "Immunity and Inflammation working together are critical to maintaining health, preventing disease, and repairing tissue damage. When all the different parts and functions of immunity are working well, the adult is immunocompetent and has maximum protection against infection. Working together, their function is not limited to destroying bacteria before damage occurs. They do not prevent the entry of all foreign materials and immunity alone regulates the process of self-tolerance.", "topic": "Immunity, Inflammation, Infection control"}, {"module": 6, "ch": 16, "chTitle": "Concepts of Inflammation and Immunity", "num": 2, "type": "Multiple Choice", "q": "A nurse is assessing an older client for the presence of infection. The client’s temperature is 97.6° F (36.4° C). What response by the nurse is best?", "opts": [["a", "Assess the client for more specific signs."], ["b", "Conclude that an infection is not present."], ["c", "Document findings and continue to monitor."], ["d", "Request the primary health care provider order blood cultures."]], "ans": ["a"], "rat": "Because older adults have decreased immune function, including reduced neutrophil function, fever may not be present during an episode of infection. The nurse would assess the client for specific signs of infection. Documentation needs to occur, but a more thorough assessment comes first. Blood cultures may or may not be needed depending on the results of further assessment.", "topic": "Inflammation, Immunity"}, {"module": 6, "ch": 16, "chTitle": "Concepts of Inflammation and Immunity", "num": 3, "type": "Multiple Choice", "q": "A clinic nurse is working with an older client. What action is most important for preventing infections in this client?", "opts": [["a", "Assessing vaccination records for booster shot needs"], ["b", "Encouraging the client to eat a nutritious diet"], ["c", "Instructing the client to wash minor wounds carefully"], ["d", "Teaching hand hygiene to prevent the spread of microbes"]], "ans": ["a"], "rat": "Older adults may have insufficient antibodies that have already been produced against microbes to which they have been exposed. Therefore, older adults need booster shots for many vaccinations they received as younger people. A nutritious diet, proper wound care, and hand hygiene are relevant for all populations.", "topic": "Immunity, Inflammation"}, {"module": 6, "ch": 16, "chTitle": "Concepts of Inflammation and Immunity", "num": 4, "type": "Multiple Choice", "q": "A client has a leg wound that is in Stage II of the inflammatory response. For what sign or symptom does the nurse assess?", "opts": [["a", "Noticeable rubor"], ["b", "Purulent drainage"], ["c", "Swelling and pain"], ["d", "Warmth at the site"]], "ans": ["b"], "rat": "During the second phase of the inflammatory response, neutrophilia occurs, producing pus. Rubor (redness), swelling, pain, and warmth are cardinal signs of the general inflammatory process.", "topic": "Inflammation, Inflammatory response"}, {"module": 6, "ch": 16, "chTitle": "Concepts of Inflammation and Immunity", "num": 5, "type": "Multiple Choice", "q": "A nurse learning about antibody-mediated immunity learns that the cell with the most direct role in this process begins development in which tissue or organ?", "opts": [["a", "Bone marrow"], ["b", "Spleen"], ["c", "Thymus"], ["d", "Tonsils"]], "ans": ["a"], "rat": "The B-cell is the primary cell in antibody-mediated immunity and is released from the bone marrow. These cells then travel to other organs and tissues, known as the secondary lymphoid tissues for B-cells.", "topic": "Immunity, Antibody-mediated immunity"}, {"module": 6, "ch": 16, "chTitle": "Concepts of Inflammation and Immunity", "num": 6, "type": "Multiple Choice", "q": "The nurse understands that which type of immunity is the longest acting?", "opts": [["a", "Artificial active"], ["b", "Inflammatory"], ["c", "Natural active"], ["d", "Natural passive"]], "ans": ["c"], "rat": "Natural active immunity is the most effective and longest acting type of immunity. Artificial and natural passive do not last as long. “Inflammatory” is not a type of immunity.", "topic": "Immunity, Antibody-mediated immunity"}, {"module": 6, "ch": 16, "chTitle": "Concepts of Inflammation and Immunity", "num": 7, "type": "Multiple Choice", "q": "The nurse working with clients who have autoimmune diseases understands that what component of cell-mediated immunity is the problem?", "opts": [["a", "CD4+ cells"], ["b", "Cytotoxic T-cells"], ["c", "Natural killer cells"], ["d", "Regulator T-cells"]], "ans": ["d"], "rat": "Regulator T-cells help prevent hypersensitivity to one’s own cells, which is the basis for autoimmune disease. CD4+ cells are also known as helper/inducer cells, which secrete cytokines. Natural killer cells have direct cytotoxic effects on some non-self cells without first being sensitized. Regulator T-cells have an inhibitory action on the immune system. Cytotoxic T-cells are effective against self cells infected by parasites such as viruses or protozoa.", "topic": "Immunity, Cell-mediated immunity"}, {"module": 6, "ch": 16, "chTitle": "Concepts of Inflammation and Immunity", "num": 8, "type": "Multiple Choice", "q": "A primary health care provider notifies the nurse that a client has a “bandemia.” What action does the nurse anticipate?", "opts": [["a", "Administer antibiotics."], ["b", "Place the client in isolation."], ["c", "Administer IV leukocytes."], ["d", "Obtain an immunization history."]], "ans": ["a"], "rat": "A bandemia, or shift to the left, in the white count differential means that an acute, continuing infection has placed so much stress on the immune system that the most numerous type of neutrophil in circulation are immature, or band cells. The nurse would anticipate administering antibiotics. The client may or may not need isolation. Leukocyte infusion and immunization history are not relevant.", "topic": "Immunity, Decreased immunity, Older adult risk factors"}, {"module": 6, "ch": 16, "chTitle": "Concepts of Inflammation and Immunity", "num": 9, "type": "Multiple Choice", "q": "What does the nurse learn about the function of colony-stimulating factor?", "opts": [["a", "Triggers the bone marrow to shorten the time needed to produce mature WBCs."], ["b", "Causes capillary leak in acute inflammation."], ["c", "Responsible for creating exudate (pus) at infectious sites."], ["d", "Dilates blood vessels at the site of inflammation leading to hyperemia."]], "ans": ["a"], "rat": "Colony-stimulating factor triggers the bone marrow to shorten the time needed to produce mature WBCs from about 14 days to hours. Increased blood flow to the local area of inflammation produces hyperemia, or redness. Exudate is formed by neutrophils and consists of dead WBCs, necrotic tissue, and fluids that escape from damaged cells. Histamine, serotonin, and kinins dilate arterioles leading to redness and warmth.", "topic": "Immunity, Older adult risk factors"}, {"module": 6, "ch": 16, "chTitle": "Concepts of Inflammation and Immunity", "num": 10, "type": "Multiple Choice", "q": "The older client’s adult child questions the nurse as to why the client is at higher risk for infection when the client’s white cell count is within the normal range. What response by the nurse is best?", "opts": [["a", "“The white cell count does not tell us everything about immunity.”"], ["b", "“White blood cells are less active in older people so they are not as efficient.”"], ["c", "“Older people typically have poor nutrition which makes them prone to infection.”"], ["d", "“As one ages, immunoglobulins cease to be produced in response to illness.”"]], "ans": ["b"], "rat": "An age-related change in immunity is that neutrophils in the older adult are less active and therefore less effective in immunity. The white blood cell count is not the only thing that can inform about immunity, but this response is too vague to be useful. Many older adults do have poor nutrition that does affect immunity, but this is not true for everyone and the stem does not contain information stating that is problematic for this older adult. Immunoglobulins do not cease to be produced with age.", "topic": "Immunity, Older adult risk factors"}, {"module": 6, "ch": 16, "chTitle": "Concepts of Inflammation and Immunity", "num": 1, "type": "Multiple Response", "q": "For a person to be immunocompetent, which processes need to be functional and interact appropriately with each other? (Select all that apply.)", "opts": [["a", "Antibody-mediated immunity"], ["b", "Cell-mediated immunity"], ["c", "Inflammation"], ["d", "Red blood cells"], ["e", "White blood cells"]], "ans": ["a", "b", "c"], "rat": "The three processes that need to be functional and interact with each other for a person to be immunocompetent are antibody-mediated immunity, cell-mediated immunity, and inflammation. Red and white blood cells are not processes.", "topic": "Immunity, Inflammation"}, {"module": 6, "ch": 16, "chTitle": "Concepts of Inflammation and Immunity", "num": 2, "type": "Multiple Response", "q": "A nurse is learning about the types of different cells involved in the inflammatory response. Which principles does the nurse learn? (Select all that apply.)", "opts": [["a", "Basophils are only involved in the general inflammatory process."], ["b", "Eosinophils increase during allergic reactions and parasitic invasion."], ["c", "Macrophages can participate in many episodes of phagocytosis."], ["d", "Monocytes turn into macrophages after they enter body tissues."], ["e", "Neutrophils can only take part in one episode of phagocytosis."]], "ans": ["b", "c", "d", "e"], "rat": "Eosinophils do increase during allergic and parasitic invasion. Macrophages participate in many episodes of phagocytosis. Monocytes turn into macrophages after they enter body tissues. Neutrophils only take part in one episode of phagocytosis. Basophils are involved in both the general inflammatory response and allergic or hypersensitivity responses.", "topic": "Inflammation, Immunity"}, {"module": 6, "ch": 16, "chTitle": "Concepts of Inflammation and Immunity", "num": 3, "type": "Multiple Response", "q": "The nurse assesses clients for the cardinal signs of inflammation. Which signs/symptoms does this include? (Select all that apply.)", "opts": [["a", "Edema"], ["b", "Pulselessness"], ["c", "Pallor"], ["d", "Redness"], ["e", "Warmth"], ["f", "Decreased function"]], "ans": ["a", "d", "e", "f"], "rat": "The five cardinal signs of inflammation include redness, warmth, pain, swelling, and decreased function.", "topic": "Inflammation, Immunity, Nursing assessment"}, {"module": 6, "ch": 16, "chTitle": "Concepts of Inflammation and Immunity", "num": 4, "type": "Multiple Response", "q": "Which are steps in the process of making an antigen-specific antibody? (Select all that apply.)", "opts": [["a", "Antibody-antigen binding"], ["b", "Invasion"], ["c", "Opsonization"], ["d", "Recognition"], ["e", "Sensitization"], ["f", "Production"]], "ans": ["a", "b", "d", "e", "f"], "rat": "The seven steps in the process of making antigen-specific antibodies are: exposure/invasion, antigen recognition, sensitization, antibody production and release, antigen-antibody binding, antibody binding actions, and sustained immunity. Opsonization is the adherence of an antibody to the antigen, marking it for destruction.", "topic": "Immunity, Antibody-mediated immunity"}, {"module": 6, "ch": 16, "chTitle": "Concepts of Inflammation and Immunity", "num": 5, "type": "Multiple Response", "q": "The nurse is learning about immunoglobulins. . Which principles does the nurse learn? (Select all that apply.)", "opts": [["a", "IgA is found in high concentrations in secretions from mucous membranes."], ["b", "IgD is present in the highest concentrations in mucous membranes."], ["c", "IgE is associated with antibody-mediated hypersensitivity reactions."], ["d", "IgG comprises the majority of the circulating antibody population."], ["e", "IgM is the first antibody formed by a newly sensitized B-cell."]], "ans": ["a", "c", "d", "e"], "rat": "Immunoglobulin A (IgA) is found in high concentrations in secretions from mucous membranes. Immunoglobulin E (IgE) is associated with antibody-mediated hypersensitivity reactions. The majority of the circulating antibody population consists of immunoglobulin G (IgG). The first antibody formed by a newly sensitized B-cell is immunoglobulin M (IgM). Immunoglobulin D (IgD) is typically present in low concentrations.", "topic": "Immunity, Antibodies"}, {"module": 6, "ch": 16, "chTitle": "Concepts of Inflammation and Immunity", "num": 6, "type": "Multiple Response", "q": "The nurse learns that which risk factors can affect immunity? (Select all that apply.)", "opts": [["a", "Age"], ["b", "Environmental factors"], ["c", "Ethnicity"], ["d", "Drugs"], ["e", "Nutritional status"]], "ans": ["a", "b", "d", "e"], "rat": "Immunity changes during an adult’s life as a result of nutritional status, environmental conditions, drugs, disease, and age. Immunity is most efficient in young adults and older adults have decreased immune function. Ethnicity does not affect immunity.", "topic": "Immunity, Older adult risk factors"}, {"module": 6, "ch": 16, "chTitle": "Concepts of Inflammation and Immunity", "num": 7, "type": "Multiple Response", "q": "The nurse is teaching an elderly client the risks of infection for older adults. Which of the following factors would the nurse include in the education? (Select all that apply.)", "opts": [["a", "Higher risk for respiratory tract and genitourinary infections."], ["b", "May not have a fever with severe infection."], ["c", "Show expected changes in white blood cell counts."], ["d", "Should receive influenza, pneumococcal, and shingles vaccinations."], ["e", "Skin tests for tuberculosis may be falsely negative."], ["f", "Booster vaccinations are not likely needed as one ages."]], "ans": ["a", "b", "d", "e"], "rat": "Immunity changes during an adult’s life and older adults have decreased immune function. The number and function of neutrophils and macrophages are reduced leading to reduced response to infection and injury, such as temperature elevation. The usual response of an increased white blood cell count is delayed or absent. Older adults are less able to make new antibodies in response to the presence of new antigens requiring repeat vaccinations and immunizations. Skin tests for tuberculosis may be falsely negative and there is an increased risk for bacterial and fungal infections due to the decreased number of circulating T-lymphocytes.", "topic": "Immunity, Older adult risk factors"}, {"module": 6, "ch": 16, "chTitle": "Concepts of Inflammation and Immunity", "num": 8, "type": "Multiple Response", "q": "A nurse is studying the functions of specific leukocytes. Which leukocytes are matched correctly with their function? (Select all that apply.)", "opts": [["a", "Monocyte: matures into a macrophage."], ["b", "Basophil: releases vasoactive amines during an allergic reaction."], ["c", "Plasma cell: secretes immunoglobulins in response to the presence of a specific antigen."], ["d", "Cytotoxic T-cells: attacks and destroys ingested poisons and toxins."], ["e", "Natural killer cell: nonselectively attacks non-self cells."], ["f", "Regulator T-cells: become sensitized for self-recognition in the bone marrow."]], "ans": ["a", "c", "e"], "rat": "Monocytes mature into macrophages, plasma cells secrete immunoglobulin in the presence of specific antigens, and natural killer cells nonselectively attack non-self cells. Basophils release histamines, kinins, and heparin in areas of tissue damage. Cytotoxic T-cells selectively attack and destroy non-self cells, including virally infected cells, grafts, and transplanted organs. Regulator T-cells become sensitized for self-recognition in the thymus.", "topic": "Immunity, Leukocytes"}, {"module": 6, "ch": 16, "chTitle": "Concepts of Inflammation and Immunity", "num": 9, "type": "Multiple Response", "q": "A nurse is studying the function of immunoglobulins. Which immunoglobulins are correctly matched to their function? (Select all that apply.)", "opts": [["a", "IgA: most responsible for preventing infection in the respiratory tracts, the GI tract, and the genitourinary tract."], ["b", "IgD: provides protection against parasite infestations, especially helminths."], ["c", "IgE: associated with antibody-mediated immediate hypersensitivity reactions."], ["d", "IgG: activates classic complement pathway and enhances neutrophil and macrophage actions."], ["e", "IgM: first antibody formed by a newly sensitized B-lymphocyte plasma cell."]], "ans": ["a", "c", "d", "e"], "rat": "All options are true except IgD acts as a B-cell antigen receptor. IgE provides protection against parasite infestations, especially helminths.", "topic": "Immunity, Immunoglobulins"}, {"module": 6, "ch": 16, "chTitle": "Concepts of Inflammation and Immunity", "num": 10, "type": "Multiple Response", "q": "The nurse caring for clients assesses their daily laboratory profiles. Which lab results are considered to be in the normal range? (Select all that apply.)", "opts": [["a", "Segmented neutrophils: 68%"], ["b", "Bands: 19%"], ["c", "Monocytes: 12%"], ["d", "Lymphocytes: 38%"], ["e", "Eosinophils: 2%"], ["f", "Basophils: 1%"]], "ans": ["a", "d", "e", "f"], "rat": "The normal range for segmented neutrophils is 55% to 70%. The normal range for bands is 5%. The normal range for monocytes is 2% to 8%. The normal range for lymphocytes is 20% to 40%. The normal range for eosinophils is 1% to 4%. The normal range for basophils is 0.5% to 1%.", "topic": "Immunity, White blood cells"}, {"module": 6, "ch": 16, "chTitle": "Concepts of Inflammation and Immunity", "num": 11, "type": "Multiple Response", "q": "What statements about the complement system are correct? (Select all that apply.)", "opts": [["a", "Comprised of 20 types of inactive plasma proteins."], ["b", "Act as enzymes when activated to enhance innate immunity."], ["c", "Phagocytize foreign invaders quickly by destroying their membranes."], ["d", "Sticks to the antigen and forms a membrane attack complex."], ["e", "Maintain and prolong inflammation from non-self cells."], ["f", "Is part of the innate immune system."]], "ans": ["a", "b", "d", "f"], "rat": "The complement system is made up of 20 different types of inactive plasma proteins that, when activated, act as enzymes to enhance (or complement) cell actions in innate immunity. They join other proteins to surround antigens and “fix” or stick to the antigen quickly forming a membrane attack complex on the antigen surface. This action makes immune cell attachment to antigens and phagocytosis more efficient. They are part of innate immunity. They do not phagocytize invaders themselves nor do they maintain and prolong inflammation from allergens.", "topic": "Immunity, Complement System"}, {"module": 6, "ch": 17, "chTitle": "Concepts of Care for Patients With HIV Disease", "num": 1, "type": "Multiple Choice", "q": "The nurse is caring for a client diagnosed with HIV-II. The client’s CD4+ cell count is 399/mm3 (0.399  109/L). What action by the nurse is best?", "opts": [["a", "Counsel the client on safer sex practices/abstinence."], ["b", "Encourage the client to abstain from alcohol."], ["c", "Facilitate genetic testing for CD4+ CCR5/CXCR4 co-receptors."], ["d", "Help the client plan high-protein/iron meals."]], "ans": ["a"], "rat": "This client is in the Centers for Disease Control and Prevention HIV-II case definition group. He or she remains highly infectious and would be counseled on either safer sex practices or abstinence. Abstaining from alcohol is healthy but not required, although some medications may need to be taken while abstaining. Genetic testing is not commonly done, but an alteration on the CCR5/CXCR4 co-receptors is seen in long-term nonprogressors. High-protein/iron meals are important for people who are immunosuppressed, but helping to plan them does not take precedence over stopping the spread of the disease.", "topic": "HIV disease, Health teaching"}, {"module": 6, "ch": 17, "chTitle": "Concepts of Care for Patients With HIV Disease", "num": 2, "type": "Multiple Choice", "q": "The nurse is presenting information to a community group on safer sex practices. The nurse would teach that which sexual practice is the riskiest?", "opts": [["a", "Anal intercourse"], ["b", "Masturbation"], ["c", "Oral sex"], ["d", "Vaginal intercourse"]], "ans": ["a"], "rat": "Anal intercourse is the riskiest sexual practice because the fragile anal tissue can tear, creating a portal of entry for human immune deficiency virus in addition to providing mucus membrane contact with the virus.", "topic": "HIV disease, Health teaching"}, {"module": 6, "ch": 17, "chTitle": "Concepts of Care for Patients With HIV Disease", "num": 3, "type": "Multiple Choice", "q": "The nurse providing direct client care uses specific practices to reduce the chance of acquiring infection with human immune deficiency virus (HIV) from clients. Which practice is most effective?", "opts": [["a", "Consistent use of Standard Precautions"], ["b", "Double-gloving before body fluid exposure"], ["c", "Labeling charts and armbands “HIV+”"], ["d", "Wearing a mask within 3 feet (1 m) of the client"]], "ans": ["a"], "rat": "According to The Joint Commission, the most effective preventative measure to avoid HIV exposure is consistent use of Standard Precautions. Standard Precautions are required by the CDC. Double-gloving is not necessary. Labeling charts and armbands in this fashion is a violation of the Health Information Portability and Accountability Act (HIPAA). Wearing a mask within 3 feet (1 m) of the client is not necessary with every client contact.", "topic": "HIV disease, Standard precautions"}, {"module": 6, "ch": 17, "chTitle": "Concepts of Care for Patients With HIV Disease", "num": 4, "type": "Multiple Choice", "q": "A client with known HIV-II is admitted to the hospital with fever, night sweats, and severe cough. Laboratory results include a CD4+ cell count of 180/mm3 and a negative tuberculosis (TB) skin test 4 days ago. What action would the nurse take first?", "opts": [["a", "Initiate Droplet Precautions for the client."], ["b", "Notify the primary health care provider about the CD4+ results."], ["c", "Place the client under Airborne Precautions."], ["d", "Use Standard Precautions to provide care."]], "ans": ["c"], "rat": "Since this client’s CD4+ cell count is so low, he or she may have energy, or the inability to mount an immune response to the TB test. The client also appears to have progressed to HIV-III. The nurse would first place the client on Airborne Precautions to prevent the spread of TB if it is present. Next the nurse notifies the primary health care provider about the low CD4+ count and requests alterative testing for TB. Droplet Precautions are not used for TB. Standard Precautions are not adequate in this case.", "topic": "HIV disease, Transmission-based precautions"}, {"module": 6, "ch": 17, "chTitle": "Concepts of Care for Patients With HIV Disease", "num": 5, "type": "Multiple Choice", "q": "A nurse is talking with a client about a negative enzyme-linked immunosorbent assay (ELISA) test for human immune deficiency virus (HIV). The test is negative and the client states “Whew! I was really worried about that result.” What action by the nurse is most important?", "opts": [["a", "Assess the client’s sexual activity and patterns."], ["b", "Express happiness over the test result."], ["c", "Remind the client about safer sex practices."], ["d", "Tell the client to be retested in 3 months."]], "ans": ["a"], "rat": "The ELISA test can be falsely negative if testing occurs after the client has become infected but prior to making antibodies to HIV. This period of time is known as the window period and can last up to 21 days. The confirmatory Western Blot test takes an additional 7 days, so using that testing algorithm, the client’s status may not truly be known for up to 28 days. The client may have had exposure that has not yet been confirmed. The nurse needs to assess the client’s sexual behavior further to determine the proper response. The other actions are not the most important, but discussing safer sex practices is always appropriate. Testing would be recommended every 3 months for someone engaging in high risk behaviors.", "topic": "HIV disease, Nursing assessment"}, {"module": 6, "ch": 17, "chTitle": "Concepts of Care for Patients With HIV Disease", "num": 6, "type": "Multiple Choice", "q": "A client with HIV-II has had a sudden decline in status with a large increase in viral load. What action would the nurse take first?", "opts": [["a", "Ask the client about travel to any foreign countries."], ["b", "Assess the client for adherence to the drug regimen."], ["c", "Determine if the client has any new sexual partners."], ["d", "Request information about new living quarters or pets."]], "ans": ["b"], "rat": "Adherence to the complex drug regimen needed for HIV treatment can be daunting. Clients must take their medications on time and correctly at a minimum of 90% of the time to be effective. Since this client’s viral load has increased dramatically, the nurse would first assess this factor. After this, the other assessments may or may not be needed.", "topic": "HIV disease, Nursing assessment"}, {"module": 6, "ch": 17, "chTitle": "Concepts of Care for Patients With HIV Disease", "num": 7, "type": "Multiple Choice", "q": "A client is hospitalized with Pneumocystis jiroveci pneumonia. The client reports shortness of breath with activity and extreme fatigue. What intervention is best to promote comfort?", "opts": [["a", "Administer sleeping medication."], ["b", "Perform most activities for the client."], ["c", "Increase the client’s oxygen during activity."], ["d", "Pace activities, allowing for adequate rest."]], "ans": ["d"], "rat": "This client has two major reasons for fatigue: decreased oxygenation and systemic illness. The nurse would not do everything for the client but rather let the client do as much as possible within limits and allow for adequate rest in between. Sleeping medications may be needed but not as the first step, and only with caution. Increasing oxygen during activities may or may not be warranted, but first the nurse must try pacing the client’s activity.", "topic": "HIV disease, Fatigue"}, {"module": 6, "ch": 17, "chTitle": "Concepts of Care for Patients With HIV Disease", "num": 8, "type": "Multiple Choice", "q": "A client with HIV-III and wasting syndrome has inadequate nutrition. What assessment finding by the nurse best indicates that goals have been met for this client problem?", "opts": [["a", "Chooses high-protein food."], ["b", "Has decreased oral discomfort."], ["c", "Eats 90% of meals and snacks."], ["d", "Has a weight gain of 2 lb (1 kg)/1 mo."]], "ans": ["d"], "rat": "The weight gain is the best indicator that goals for this client problem have been met because it demonstrates that the client not only is eating well but also is able to absorb the nutrients. Choosing high-protein food is important, but only if the client eats and absorbs the nutrients.", "topic": "HIV disease, Nutrition"}, {"module": 6, "ch": 17, "chTitle": "Concepts of Care for Patients With HIV Disease", "num": 9, "type": "Multiple Choice", "q": "A client with HIV-III is hospitalized and has weeping Kaposi sarcoma lesions. The nurse dresses them with sterile gauze. When changing these dressings, which action is most important for the nurse’s safety?", "opts": [["a", "Adhering to Standard Precautions"], ["b", "Assessing tolerance to dressing changes"], ["c", "Performing hand hygiene before and after care"], ["d", "Disposing of soiled dressings properly"]], "ans": ["a"], "rat": "All of the actions are important, but due to the infectious nature of this illness, the nurse would ensure he or she is following Standard Precautions (and Transmission-Based Precautions when necessary) to avoid a potential exposure.", "topic": "HIV disease, Standard precautions"}, {"module": 6, "ch": 17, "chTitle": "Concepts of Care for Patients With HIV Disease", "num": 10, "type": "Multiple Choice", "q": "A client with HIV-III is admitted to the hospital with Toxoplasma gondii infection. Which action by the nurse is most appropriate?", "opts": [["a", "Initiate Contact Precautions."], ["b", "Conduct frequent neurologic assessments."], ["c", "Conduct frequent respiratory assessments."], ["d", "Initiate Protective Precautions."]], "ans": ["d"], "rat": "Toxoplasma gondii infection is an opportunistic infection that causes an encephalitis but poses only a rare threat to immunocompetent individuals The nurse would perform ongoing neurologic assessments. Contact and Protective Precautions are not needed. Good respiratory assessments are important to the client, but toxoplasmosis will demonstrate neurologic signs and symptoms.", "topic": "HIV disease, Nursing assessment"}, {"module": 6, "ch": 17, "chTitle": "Concepts of Care for Patients With HIV Disease", "num": 11, "type": "Multiple Choice", "q": "A client has just been informed of a positive HIV test. The client is distraught and does not know what to do. What intervention by the nurse is best?", "opts": [["a", "Assess the client for support systems."], ["b", "Determine if a clergy member would help."], ["c", "Explain legal requirements to tell sex partners."], ["d", "Offer to tell the family for the client."]], "ans": ["a"], "rat": "This client needs the assistance of support systems. The nurse would help the client identify them and what role they can play in supporting him or her. A clergy member may or may not be welcome. Positive HIV test results are reportable in all 50 states, Washington, D.C., and Canada but the nurse works with the client to support his or her choices in disclosure. The nurse would not tell the family for the client.", "topic": "HIV disease, Psychosocial response"}, {"module": 6, "ch": 17, "chTitle": "Concepts of Care for Patients With HIV Disease", "num": 12, "type": "Multiple Choice", "q": "A nurse is caring for a client with HIV-III who was admitted with HAND. What sign or symptom would be most important for the nurse to report to the primary health care provider?", "opts": [["a", "Nausea"], ["b", "Change in pupil size"], ["c", "Weeping open lesions"], ["d", "Cough"]], "ans": ["b"], "rat": "HIV-associated neurocognitive disorder (HAND) is a sign of neurologic involvement. The nurse would report any sign of increasing intracranial pressure immediately, including change in pupil size, level of consciousness, vital signs, or limb strength. The other signs and symptoms are not life threatening and would be documented and reported appropriately.", "topic": "HIV disease"}, {"module": 6, "ch": 17, "chTitle": "Concepts of Care for Patients With HIV Disease", "num": 13, "type": "Multiple Choice", "q": "A client has been hospitalized with an opportunistic infection secondary to HIV-III. The client’s partner is listed as the emergency contact, but the client’s mother insists that she should be listed instead. What action by the nurse is best?", "opts": [["a", "Contact the social worker to assist the client with advance directives."], ["b", "Ignore the mother; the client does not want her to be involved."], ["c", "Let the client know, gently, that nurses cannot be involved in these disputes."], ["d", "Tell the client that, legally, the mother is the emergency contact."]], "ans": ["a"], "rat": "The client should make his or her wishes known and formalize them through advance directives. The nurse would help the client by contacting someone to help with this process. Ignoring the mother or telling the client that nurses cannot be involved does not help the situation. Legal statutes vary by state, but the nurse would be the client’s advocate and help ensure his or her wishes are met.", "topic": "HIV disease, Ethics"}, {"module": 6, "ch": 17, "chTitle": "Concepts of Care for Patients With HIV Disease", "num": 14, "type": "Multiple Choice", "q": "A client with HIV-II is hospitalized for an unrelated condition, and several medications are prescribed in addition to the regimen already being used. What action by the nurse is most important?", "opts": [["a", "Consult with the pharmacy about drug interactions."], ["b", "Ensure that the client understands the new medications."], ["c", "Give the new drugs without considering the old ones."], ["d", "Schedule all medications at standard times."]], "ans": ["a"], "rat": "The drug regimen for someone with HIV/AIDS is complex and consists of many medications that must be given at specific times of the day, and that have many interactions with other drugs and food. The nurse would consult with a pharmacist about possible interactions. Client teaching is important but does not take precedence over ensuring the medications do not interfere with each other, which could lead to drug resistance or a resurgence of symptoms.", "topic": "HIV disease, Medication safety"}, {"module": 6, "ch": 17, "chTitle": "Concepts of Care for Patients With HIV Disease", "num": 15, "type": "Multiple Choice", "q": "A client with HIV-III has been hospitalized with suspected cryptosporidiosis. What physical assessment would be most important with this condition?", "opts": [["a", "Auscultating the lungs"], ["b", "Assessing mucous membranes"], ["c", "Listening to bowel sounds"], ["d", "Performing a neurologic examination"]], "ans": ["b"], "rat": "Cryptosporidiosis can cause diarrhea and wasting with extreme loss of fluids and electrolytes. The nurse would assess signs of hydration/dehydration as the priority, including checking the client’s mucous membranes for dryness. The nurse will perform the other assessments as part of a comprehensive assessment.", "topic": "HIV disease, Nursing assessment"}, {"module": 6, "ch": 17, "chTitle": "Concepts of Care for Patients With HIV Disease", "num": 16, "type": "Multiple Choice", "q": "A client with HIV-III asks the nurse why gabapentin is part of the drug regimen when the client does not have a history of seizures. What response by the nurse is best?", "opts": [["a", "“Gabapentin can be used as an antidepressant too.”"], ["b", "“I have no idea why you would be taking this drug.”"], ["c", "“This drug helps treat the pain from nerve irritation.”"], ["d", "“You are at risk for seizures due to fungal infections.”"]], "ans": ["c"], "rat": "Many classes of medications are used for neuropathic pain, including tricyclic antidepressants and anticonvulsants such as gabapentin. It is not being used to prevent seizures from fungal infections. If the nurse does not know the answer, he or she would find out for the client.", "topic": "HIV disease, Pharmacologic pain management"}, {"module": 6, "ch": 17, "chTitle": "Concepts of Care for Patients With HIV Disease", "num": 17, "type": "Multiple Choice", "q": "An HIV-negative client who has an HIV-positive partner asks the nurse about receiving tenofovir/emtricitabine. What information is most important to teach the client about this drug?", "opts": [["a", "Does not reduce the need for safe sex practices."], ["b", "Has been taken off the market due to increases in cancer."], ["c", "Reduces the number of HIV tests you will need."], ["d", "Is only used for postexposure prophylaxis."]], "ans": ["a"], "rat": "Tenofovir/emtricitabine is a newer drug used for preexposure prophylaxis and appears to reduce transmission of human immune deficiency virus (HIV) from known HIV-positive people to HIV-negative people. The drug does not reduce the need for practicing safe sex. Since the drug can lead to drug resistance if used, clients will still need HIV testing every 3 months. This drug has not been taken off the market and is not used for postexposure prophylaxis.", "topic": "HIV disease, Health teaching"}, {"module": 6, "ch": 17, "chTitle": "Concepts of Care for Patients With HIV Disease", "num": 1, "type": "Multiple Response", "q": "A nurse is learning about human immune deficiency virus (HIV) infection. Which statements about HIV infection are correct? (Select all that apply.)", "opts": [["a", "CD4+ cells begin to create new HIV virus particles."], ["b", "Antibodies produced are incomplete and do not function well."], ["c", "Macrophages stop functioning properly."], ["d", "Opportunistic infections and cancer are leading causes of death."], ["e", "People with HIV-I disease are not infectious to others."], ["f", "The CD4+ T-cell is only affected when the disease has progressed to HIV-III"]], "ans": ["a", "b", "c", "d"], "rat": "In HIV, CD4+ cells begin to create new HIV particles. Antibodies the client produce are incomplete and do not function well. Macrophages also stop functioning properly. Opportunistic infections and cancer are the two leading causes of death in client’s with HIV infection. People infected with HIV are infectious in all stages of the disease. The CD4+ T-cell is the immune system cell most affected by infection with the HIV virus.", "topic": "HIV disease, Pathophysiology"}, {"module": 6, "ch": 17, "chTitle": "Concepts of Care for Patients With HIV Disease", "num": 2, "type": "Multiple Response", "q": "Which findings are AIDS-defining characteristics? (Select all that apply.)", "opts": [["a", "CD4+ cell count less than 200/mm3 (0.2  109/L) or less than 14%"], ["b", "Infection with P. jiroveci"], ["c", "Positive enzyme-linked immunosorbent assay (ELISA) test for human immune deficiency virus (HIV)"], ["d", "Presence of HIV wasting syndrome"], ["e", "Taking antiretroviral medications"], ["f", "Confusion, dementia, or memory loss"]], "ans": ["a", "b", "d", "f"], "rat": "A diagnosis of AIDS requires that the person be HIV positive and have either a CD4+ T-cell count of less than 200 cells/mm3 (0.2  109/L) or less than 14% (even if the total CD4+ count is above 200 cells/mm3) or an opportunistic infection such as P. jiroveci and HIV wasting syndrome. Confusion, dementia, and memory loss are central nervous system indications. Having a positive ELISA test and taking antiretroviral medications are not AIDS-defining characteristics.", "topic": "HIV disease"}, {"module": 6, "ch": 17, "chTitle": "Concepts of Care for Patients With HIV Disease", "num": 3, "type": "Multiple Response", "q": "The nurse is teaching a client about medications for HIV-II treatment. What drugs are paired with the correct information? (Select all that apply.)", "opts": [["a", "Abacavir: avoid fatty and fried foods."], ["b", "Efavirenz: take 1 hour before or 2 hours after antacids."], ["c", "Atazanavir: check pulse daily and report pulse greater than 100 beats/min."], ["d", "Dolutegravir: do not take this medication if you become pregnant."], ["e", "Enfuvirtide: teach client how to operate syringe infusion pump for administration."], ["f", "All drugs: you must adhere to the drug schedule at least 90% of the time for effectiveness."]], "ans": ["a", "b", "f"], "rat": "Abacavir is a nucleoside reverse transcriptase inhibitor and clients are taught to avoid fried and fatty foods because they can lead to digestive upsets and even pancreatitis. Efavirenz is a nonnucleoside reverse transcriptase inhibitor and clients are taught to take them (doraverene) all except spaced 1 hour before or 2 hours after antacids to avoid inhibiting drug absorption. Atazanavir is a protease inhibitor and can cause bradycardia which should be reported. Dolutegravir is an integrase inhibitor and can cause birth defects. Enfuvirtide is a fusion inhibitor and is given subcutaneously. All drugs must be taken as scheduled 90% of the time in order to remain effective.", "topic": "HIV disease, Medications"}, {"module": 6, "ch": 17, "chTitle": "Concepts of Care for Patients With HIV Disease", "num": 4, "type": "Multiple Response", "q": "A client with HIV-III is hospitalized with P. jiroveci pneumonia and is started on the drug of choice for this infection. What laboratory values would be most important for the nurse report to the primary health care provider? (Select all that apply.)", "opts": [["a", "Aspartate transaminase, alanine transaminase: elevated"], ["b", "CD4+ cell count: 180/mm3"], ["c", "Creatinine: 1.0 mg/dL (88 mcmol/L)"], ["d", "Platelet count: 80,000/mm3 (80  109/L)"], ["e", "Serum sodium: 120 mEq/L (120 mmol/L)"], ["f", "Serum potassium: 3.4 mEq/L (3.4 mmol/L)"]], "ans": ["a", "d", "e"], "rat": "The drug of choice to treat P. jiroveci pneumonia is trimethoprim with sulfamethoxazole. Side effects of this drug include hepatitis, hyponatremia, and thrombocytopenia. The elevated liver enzymes, low platelet count, and low sodium would all be reported. The CD4+ cell count is within the expected range for a client with an AIDS-defining infection. The creatinine level is normal and the potassium is just below normal.", "topic": "HIV disease, Medication side effects"}, {"module": 6, "ch": 17, "chTitle": "Concepts of Care for Patients With HIV Disease", "num": 5, "type": "Multiple Response", "q": "A client with HIV-III has oral thrush and difficulty eating. What actions does the nurse delegate to the assistive personnel (AP)? (Select all that apply.)", "opts": [["a", "Apply oral anesthetic gels before meals."], ["b", "Assist the client with oral care every 2 hours."], ["c", "Offer the client frequent sips of cool drinks."], ["d", "Provide the client with alcohol-based mouthwash."], ["e", "Remind the client to use only a soft toothbrush."], ["f", "Offer the client soft foods like gelatin or pudding."]], "ans": ["b", "c", "e", "f"], "rat": "The AP can help the client with oral care, offer fluids, and remind the client of things the nurse (or other professional) has already taught. Soft foods and liquids are tolerated better than harder foods. Applying medications is performed by the nurse. Alcohol-based mouthwashes are harsh and drying and would not be used.", "topic": "HIV disease, Delegation"}, {"module": 6, "ch": 17, "chTitle": "Concepts of Care for Patients With HIV Disease", "num": 6, "type": "Multiple Response", "q": "A client with HIV-III is in the hospital with severe diarrhea. What actions does the nurse delegate to assistive personnel (AP)? (Select all that apply.)", "opts": [["a", "Assessing the client’s fluid and electrolyte status"], ["b", "Assisting the client to get out of bed to prevent falls"], ["c", "Obtaining a bedside commode if the client is weak"], ["d", "Providing gentle perianal cleansing after stools"], ["e", "Reporting any perianal abnormalities"]], "ans": ["b", "c", "d", "e"], "rat": "The AP can assist the client with getting out of bed, obtain a bedside commode for the client’s use, cleanse the client’s perianal area after bowel movements, and report any abnormal observations such as redness or open areas. The nurse assesses fluid and electrolyte status.", "topic": "HIV disease, Delegation"}, {"module": 6, "ch": 17, "chTitle": "Concepts of Care for Patients With HIV Disease", "num": 7, "type": "Multiple Response", "q": "The nurse is educating a client with HIV-II and the partner on self-care measures to prevent infection when blood counts are low. What information does the nurse provide? (Select all that apply.)", "opts": [["a", "Do not work in the garden or with houseplants."], ["b", "Do not empty the kitty litter boxes."], ["c", "Clean your toothbrush in the dishwasher daily."], ["d", "Bathe daily using antimicrobial soap."], ["e", "Avoid people who are sick and large crowds."], ["f", "Make sure meat, fish, and eggs are cooked well."]], "ans": ["a", "b", "d", "e", "f"], "rat": "Ways to avoid infection when immunocompromised include not working in the garden or with houseplants; not emptying litter boxes; running the toothbrush through the dishwasher at least weekly; bathing daily using antimicrobial soap; avoiding sick people and large crowds; and making sure meat, fish, and eggs are cooked well prior to eating them.", "topic": "HIV disease, Health teaching"}, {"module": 6, "ch": 17, "chTitle": "Concepts of Care for Patients With HIV Disease", "num": 8, "type": "Multiple Response", "q": "A nurse is providing education about HIV risks at a health fair. What groups would the nurse include as needing to be tested for HIV on an annual basis? (Select all that apply.)", "opts": [["a", "Anyone who received a blood product in 1989"], ["b", "Couples planning on getting married"], ["c", "Those who are sexually active with multiple partners"], ["d", "Injection drugs users"], ["e", "Sex workers and their customers"], ["f", "Adults over the age of 65 years"]], "ans": ["b", "c", "d", "e"], "rat": "The CDC recommends that HIV testing would be performed on those who received a transfusion between 1978 and 1985 only. People planning on getting married should be tested and all sexually active people should know their HIV status. Those engaged in sex work and their customers should also be tested, as well as injection drug users. Those over the age of 65 years need a one-time screen.", "topic": "HIV disease, Secondary prevention"}, {"module": 6, "ch": 17, "chTitle": "Concepts of Care for Patients With HIV Disease", "num": 9, "type": "Multiple Response", "q": "A nurse begins a job at a Veterans Administration Hospital and asks why so much emphasis is on HIV testing for the veterans. What reasons is this nurse given? (Select all that apply.)", "opts": [["a", "Veterans have a high prevalence of substance abuse."], ["b", "Many veterans may engage in high risk behaviors."], ["c", "Many older veterans may not know their risks."], ["d", "Everyone should know their HIV status."], ["e", "Belief that the VA has tested them and would notify them if positive."]], "ans": ["a", "b", "c", "d", "e"], "rat": "All options are correct for the veteran population. The nurse interacting with veteran would ensure they know about the HIV testing offered by the VA.", "topic": "HIV disease, Veterans' health considerations"}, {"module": 6, "ch": 18, "chTitle": "Concepts of Care for Patients With Hypersensitivity (Allergy) and", "num": 1, "type": "Multiple Choice", "q": "A nurse is teaching the client with systemic lupus erythematosus about prednisone. What information is the priority?", "opts": [["a", "Might make the client feel jittery or nervous."], ["b", "Can cause sodium and fluid retention."], ["c", "Long-term effects include fat redistribution."], ["d", "Never stop prednisone abruptly."]], "ans": ["d"], "rat": "The nurse teaches the client to avoid stopping the drug abruptly as the priority because this can lead to a life-threatening adrenal crisis. Short-term side effects do include jitteriness or nervousness, sodium and water retention. One long-term side effect is fat redistribution resulting in “moon face” and “buffalo hump.”", "topic": "SLE, Health teaching"}, {"module": 6, "ch": 18, "chTitle": "Concepts of Care for Patients With Hypersensitivity (Allergy) and", "num": 2, "type": "Multiple Choice", "q": "The nurse is caring for clients on the medical-surgical unit. What action by the nurse will help prevent a client from having a type II hypersensitivity reaction?", "opts": [["a", "Administering steroids for a positive TB test"], ["b", "Correctly identifying the client prior to a blood transfusion"], ["c", "Keeping the client free of the offending agent"], ["d", "Providing a latex-free environment for the client"]], "ans": ["b"], "rat": "A classic example of a type II hypersensitivity reaction is a blood transfusion reaction. These can be prevented by correctly identifying the client and cross-checking the unit of blood to be administered. A positive type IV response is a positive TB test. Avoidance therapy is the cornerstone of treatment for a type IV hypersensitivity to substances that are known and can be avoided such as poison ivy and insect stings. Latex allergies are a type I hypersensitivity.", "topic": "Hypersensitivities, Immunity"}, {"module": 6, "ch": 18, "chTitle": "Concepts of Care for Patients With Hypersensitivity (Allergy) and", "num": 3, "type": "Multiple Choice", "q": "A client has been newly diagnosed with systemic lupus erythematosus and is reviewing self-care measures with the nurse. Which statement by the client indicates a need to review the material?", "opts": [["a", "“I will avoid direct sunlight as much as possible.”"], ["b", "“Baby powder is good for the constant sweating.”"], ["c", "“Grouping errands will help prevent fatigue.”"], ["d", "“Rest time will have to become a priority.”"]], "ans": ["b"], "rat": "Constant sweating is not a sign of SLE and powders are drying so they should not be used, at least not in excess. The client is correct in stating he/she should avoid direct sunlight, that grouping errands can prevent or reduce fatigue, and that rest will have to become a priority.", "topic": "SLE, Health teaching"}, {"module": 6, "ch": 18, "chTitle": "Concepts of Care for Patients With Hypersensitivity (Allergy) and", "num": 4, "type": "Multiple Choice", "q": "A client calls the clinic to report exposure to poison ivy and an itchy rash that is not helped with over-the-counter antihistamines. What response by the nurse is most appropriate?", "opts": [["a", "“Antihistamines do not help poison ivy.”"], ["b", "“There are different antihistamines to try.”"], ["c", "“You should be seen in the clinic right away.”"], ["d", "“You will need to take some IV steroids.”"]], "ans": ["a"], "rat": "Since histamine is not the mediator of a type IV reaction such as with poison ivy, antihistamines will not provide relief. The nurse would educate the client about this. The client does not need to be seen right away. The client may or may not need steroids; they may be given either IV or orally.", "topic": ""}, {"module": 6, "ch": 18, "chTitle": "Concepts of Care for Patients With Hypersensitivity (Allergy) and", "num": 5, "type": "Multiple Choice", "q": "A nurse has educated a client on an epinephrine autoinjector. What statement by the client indicates additional instruction is needed?", "opts": [["a", "“I don’t need to go to the hospital after using it.”"], ["b", "“I must carry two autoinjectors with me at all times.”"], ["c", "“I will write the expiration date on my calendar.”"], ["d", "“This can be injected right through my clothes.”"]], "ans": ["a"], "rat": "Clients would be instructed to call 911 and go to the hospital for monitoring after using the autoinjector. The medication may wear off before the offending agent has cleared the client’s system. The other statements show good understanding of this treatment.", "topic": "Allergic response, Drug therapy"}, {"module": 6, "ch": 18, "chTitle": "Concepts of Care for Patients With Hypersensitivity (Allergy) and", "num": 6, "type": "Multiple Choice", "q": "A nurse has presented an educational program to a community group on Lyme disease. What statement by a participant indicates the need to review the material?", "opts": [["a", "“I should take precautions against ticks, especially in the summer.”"], ["b", "“A red rash that looks like a bull’s-eye may be one of the symptoms.”"], ["c", "“If Lyme disease is not treated successfully, it is usually fatal.”"], ["d", "“For Stage I disease, antibiotics are usually needed for 14 to 21 days.”"]], "ans": ["c"], "rat": "Untreated Lyme disease can lead to chronic complications, or Stage III Lyme disease, such as arthritis, chronic fatigue, memory/thinking problems. It is not usually a fatal disease so this information would need to be corrected by the nurse. The other participant statements are correct.", "topic": "Lyme disease, Health teaching"}, {"module": 6, "ch": 18, "chTitle": "Concepts of Care for Patients With Hypersensitivity (Allergy) and", "num": 7, "type": "Multiple Choice", "q": "A client is in the hospital and has received two doses of an angiotensin-converting enzyme for hypertension. When the nurse answers the client’s call light, the client presents an appearance as shown below: What action by the nurse takes is most appropriate?", "opts": [["a", "Administer epinephrine 1:1000, 0.3 mg IV push immediately."], ["b", "Apply oxygen by facemask at 100% and a pulse oximeter."], ["c", "Ensure a patent airway while calling the Rapid Response Team."], ["d", "Reassure the client that these symptoms will go away."]], "ans": ["c"], "rat": "This client has angioedema which is a severe type I hypersensitivity reaction and is most commonly caused by ACE-inhibitors. The nurse would ensure the client’s airway is patent and either call the Rapid Response Team or delegate this to someone else. Epinephrine needs to be administered right away, but not without a prescription by the primary health care provider unless standing orders exist. The client may need oxygen, but a patent airway comes first. Reassurance is important, but airway and calling the Rapid Response Team are the priorities.", "topic": "Rapid Response Team, Critical rescue"}, {"module": 6, "ch": 18, "chTitle": "Concepts of Care for Patients With Hypersensitivity (Allergy) and", "num": 1, "type": "Multiple Response", "q": "The nurse is studying hypersensitivity reactions. Which reactions are correctly matched with their hypersensitivity types? (Select all that apply.)", "opts": [["a", "Type I—examples include hay fever and anaphylaxis."], ["b", "Type II—mediated by action of immunoglobulin M (IgM)."], ["c", "Type III—immune complex deposits in blood vessel walls."], ["d", "Type IV—examples are poison ivy and transplant rejection."], ["e", "Type IV—involve both antibodies and complement."]], "ans": ["a", "c", "d"], "rat": "Type I reactions are mediated by immunoglobulin E (IgE) and include hay fever, anaphylaxis, and allergic asthma. Type III reactions consist of immune complexes that form and deposit in the walls of blood vessels. Type IV reactions include responses to poison ivy exposure, positive tuberculosis tests, and graft rejection. Type II reactions are mediated by immunoglobulin G, not IgM. Type IV hypersensitivity reactions do not involve either antibodies or complement.", "topic": "Hypersensitivities, Immunity"}, {"module": 6, "ch": 18, "chTitle": "Concepts of Care for Patients With Hypersensitivity (Allergy) and", "num": 2, "type": "Multiple Response", "q": "The nurse is assessing a client for signs and symptoms of systemic lupus erythematosus (SLE). Which of the following would be consistent with this disorder? (Select all that apply.)", "opts": [["a", "Discoid rash on skin exposed to sunlight"], ["b", "Urinalysis positive for casts and protein"], ["c", "Painful, deformed small joints"], ["d", "Pain on inspiration"], ["e", "Thrombocytosis"], ["f", "Serum positive for antinuclear antibodies (ANA)"]], "ans": ["a", "b", "d", "f"], "rat": "Signs and symptoms of SLE include (but are not limited to) a discoid rash on skin exposed to the sun, urinalysis with casts and protein, pleurisy as manifested by pain on inspiration, and positive ANA titers in the blood. Nonerosive arthritis in peripheral joints can occur but does not lead to deformity. Thrombocytopenia is another sign.", "topic": "SLE, Assessment"}, {"module": 6, "ch": 18, "chTitle": "Concepts of Care for Patients With Hypersensitivity (Allergy) and", "num": 3, "type": "Multiple Response", "q": "A client is being administered the first dose of belimumab for a systemic lupus erythematosus flare. What actions by the nurse are most appropriate? (Select all that apply.)", "opts": [["a", "Observe the client for at least 2 hours afterward."], ["b", "Instruct the client about the monthly infusion schedule."], ["c", "Inform the client not to drive or sign legal papers for 24 hours."], ["d", "Ensure emergency equipment is working and nearby."], ["e", "Make a follow-up appointment for a lipid panel in 2 months."], ["f", "Instruct the client to hold other medications for 72 hours."]], "ans": ["a", "d"], "rat": "This drug is a monoclonal antibody to tumor necrosis factor. The first dose would be administered in a place where severe allergic reactions and/or anaphylaxis can be managed. This includes having emergency equipment nearby. The client would be observed for at least 2 hours after this first dose. This drug does not cause drowsiness, so there would be no restrictions on driving or signing legal documents. Elevated lipids are not associated with this drug. This drug is used in combination with other therapies, especially during a flare.", "topic": "SLE, Drug therapy"}, {"module": 6, "ch": 18, "chTitle": "Concepts of Care for Patients With Hypersensitivity (Allergy) and", "num": 4, "type": "Multiple Response", "q": "A nurse caring for clients with systemic lupus erythematosus (SLE) plans care understanding the most common causes of death for these clients is which of the following? (Select all that apply.)", "opts": [["a", "Infection"], ["b", "Cardiovascular impairment"], ["c", "Vasculitis"], ["d", "Chronic kidney disease"], ["e", "Liver failure"], ["f", "Blood dyscrasias"]], "ans": ["b", "d"], "rat": "Any and all organs and tissues may be affected in SLE but the most common causes of death in clients with SLE include cardiovascular impairment and chronic kidney disease.", "topic": "SLE, Complications"}, {"module": 10, "ch": 44, "chTitle": "Assessment of the Musculoskeletal System", "num": 1, "type": "Multiple Choice", "q": "The nurse is caring for an older client who has kyphosis and a widened gait. For which health problems is the client at risk?", "opts": [["a", "Osteoporosis"], ["b", "Contracture"], ["c", "Osteopenia"], ["d", "Falls"]], "ans": ["d"], "rat": "Kyphosis is caused by bone loss and causes the client to bend forward which changes the center of gravity leading to problems with balance. Older adults who have balance issues are at risk for falls.", "topic": "Musculoskeletal assessment, Spinal deformities"}, {"module": 10, "ch": 44, "chTitle": "Assessment of the Musculoskeletal System", "num": 2, "type": "Multiple Choice", "q": "The nurse is teaching assistant personnel (AP) about care of an older ambulatory adult who has osteopenia. Which statement by the AP indicates understanding of the teaching?", "opts": [["a", "“I will tell the client to change positions frequently to prevent pressure injury.”"], ["b", "“I will remind the client to take frequent walks to strengthen bones.”"], ["c", "“I will assist the client with activities of daily living as needed.”"], ["d", "“I will apply warm compresses to the joints to relieve pain.”"]], "ans": ["b"], "rat": "The ambulatory client who has osteopenia has experienced bone loss. Therefore, taking walks as a weight-bearing exercise helps to prevent further bone loss. The client does not have joint pain and does not need assistance or position changes because the client is ambulatory and probably independent.", "topic": "Musculoskeletal assessment, Health promotion"}, {"module": 10, "ch": 44, "chTitle": "Assessment of the Musculoskeletal System", "num": 3, "type": "Multiple Choice", "q": "A client had an arthroscopy 1 hour ago on the left knee. The nurse finds the left lower leg to be pale and cool, with a 1+ pedal pulse. What action would the nurse perform first?", "opts": [["a", "Assess the neurovascular status of the right leg."], ["b", "Document the findings in the patient’s chart."], ["c", "Elevate the left leg on at least two pillows."], ["d", "Notify the primary health care provider immediately."]], "ans": ["a"], "rat": "The nurse would compare findings of the two legs as these findings may be normal for the client. If a difference is observed, the nurse would then notify the primary health care provider. Documentation would occur after the nurse has all the data. Elevating the left leg will not improve perfusion if there is a problem.", "topic": "Musculoskeletal assessment, Diagnostic tests"}, {"module": 10, "ch": 44, "chTitle": "Assessment of the Musculoskeletal System", "num": 4, "type": "Multiple Choice", "q": "A hospitalized client’s strength of the upper extremities is rated at a 4. What does the nurse understand about this client’s ability to perform activities of daily living (ADLs)?", "opts": [["a", "The client is able to perform ADLs but not lift some items."], ["b", "The client is unable to perform ADLs alone."], ["c", "No difficulties are expected with ADLs."], ["d", "The client would need almost total assistance with ADLs."]], "ans": ["c"], "rat": "This rating indicates good muscle strength with full range of motion.", "topic": "Musculoskeletal assessment, Muscle strength"}, {"module": 10, "ch": 44, "chTitle": "Assessment of the Musculoskeletal System", "num": 5, "type": "Multiple Choice", "q": "An older client is distressed at body changes related to kyphosis. What response by the nurse is appropriate?", "opts": [["a", "Ask the client to explain more about these feelings."], ["b", "Explain that these changes are irreversible."], ["c", "Offer to help select clothes to hide the deformity."], ["d", "Tell the client that safety is more important than looks."]], "ans": ["a"], "rat": "Assessment is the first step of the nursing process, and the nurse would begin by getting as much information about the client’s feelings as possible. Explaining that the changes are irreversible discounts the client’s feelings. Depending on the extent of the deformity, clothing will not hide it. While safety is more objectively important than looks, the client is worried about looks and the nurse needs to address this issue.", "topic": "Musculoskeletal assessment, Psychosocial assessment"}, {"module": 10, "ch": 44, "chTitle": "Assessment of the Musculoskeletal System", "num": 6, "type": "Multiple Choice", "q": "The nurse is taking a history from an older client who reports having frequent falls. Which dietary habit could be contributing to the client’s problem?", "opts": [["a", "Consumes high-protein foods."], ["b", "Eats few concentrated sweets."], ["c", "Limits fatty or greasy foods."], ["d", "Avoids dairy products."]], "ans": ["d"], "rat": "Falls can occur when older adults have inadequate calcium and Vitamin D because they are at risk for osteopenia and osteoporosis. Dairy products have a high concentration of both calcium and Vitamin D and this client avoids those foods. High-protein foods are recommended to help prevent osteopenia and sweets and fatty/greasy foods have no impact on bone health.", "topic": "Musculoskeletal assessment, Changes associated with aging"}, {"module": 10, "ch": 44, "chTitle": "Assessment of the Musculoskeletal System", "num": 7, "type": "Multiple Choice", "q": "The client’s electronic health record indicates genu varum. What does the nurse understand this term to mean?", "opts": [["a", "Bow-legged"], ["b", "Fluid accumulation"], ["c", "Knock-kneed"], ["d", "Spinal curvature"]], "ans": ["a"], "rat": "Genu varum is a bow-legged deformity. A fluid accumulation is an effusion. Genu valgum is knock-kneed. A spinal curvature could be kyphosis or lordosis.", "topic": "Musculoskeletal assessment, Musculoskeletal deformities"}, {"module": 10, "ch": 44, "chTitle": "Assessment of the Musculoskeletal System", "num": 8, "type": "Multiple Choice", "q": "The nurse is teaching a client who had a left humeral biopsy about home care. Which statement by the client indicates understanding of the nurse’s teaching?", "opts": [["a", "“I will take my opioids only when I have severe pain.”"], ["b", "“I will keep my left arm elevated for 24 hours.”"], ["c", "“I will watch for tenderness and warmth around the biopsy site.”"], ["d", "“I will report any discomfort to my primary health care provider immediately.”"]], "ans": ["c"], "rat": "Bone biopsy is an ambulatory procedure which can cause some discomfort but not severe pain. The client can use the affected arm soon after the procedure but should watch for tenderness and warmth which could indicate infection.", "topic": "Musculoskeletal assessment, Diagnostic tests"}, {"module": 10, "ch": 44, "chTitle": "Assessment of the Musculoskeletal System", "num": 9, "type": "Multiple Choice", "q": "The nurse is teaching assistive personnel (AP) about the risk for osteoporosis associated with race or ethnicity. Which population typically has a decreased incidence of osteoporosis when compared to Euro-Americans?", "opts": [["a", "Irish Americans"], ["b", "African Americans"], ["c", "American Indians"], ["d", "Asian Americans"]], "ans": ["b"], "rat": "African Americans usually have more bone mass when compared to Euro-Americans which makes them at a decreased risk for osteoporosis.", "topic": "Musculoskeletal assessment"}, {"module": 10, "ch": 44, "chTitle": "Assessment of the Musculoskeletal System", "num": 1, "type": "Multiple Response", "q": "A female client is preparing to have open magnetic resonance imaging (MRI) of the spine. What action(s) by the nurse is (are) most important to assess before the test? (Select all that apply.)", "opts": [["a", "Ask if the client has a history of kidney disease."], ["b", "Ask the client if she could possibly be pregnant."], ["c", "Ensure that the patient has no metal or electronic implants."], ["d", "Assess the client for the ability to communicate."], ["e", "Assess the client for a history of claustrophobia."]], "ans": ["a", "b", "c", "d"], "rat": "The contrast agent that is used for an MRI is gadolinium which can cause complications if the client is pregnant or has kidney disease. The client needs to be able to communicate and should not have any metal or electronic implants due to the magnetic nature of the machine. For an open MRI, claustrophobia is not an issue because the client is not encased in the device.", "topic": "Musculoskeletal assessment, Diagnostic tests"}, {"module": 10, "ch": 44, "chTitle": "Assessment of the Musculoskeletal System", "num": 2, "type": "Multiple Response", "q": "The nurse is reviewing the laboratory profile for a client who has muscular dystrophy. Which laboratory value(s) would the nurse expect to be elevated? (Select all that apply.)", "opts": [["a", "Calcium (Ca)"], ["b", "Phosphate (PO4)"], ["c", "Creatine kinase (CK)"], ["d", "Lactic dehydrogenase (LDH)"], ["e", "Aspartate aminotransferase (AST)"], ["f", "Aldolase (ALD)"]], "ans": ["c", "d", "e", "f"], "rat": "Muscular dystrophy causes elevations in muscle enzymes and does not affect minerals like calcium and phosphorus.", "topic": "Musculoskeletal assessment, Diagnostic tests"}, {"module": 10, "ch": 44, "chTitle": "Assessment of the Musculoskeletal System", "num": 3, "type": "Multiple Response", "q": "An older client’s serum calcium level is 8.7 mg/dL (2.18 mmol/L). What possible etiology(ies) does the nurse consider for this result? (Select all that apply.)", "opts": [["a", "Good dietary intake of calcium and vitamin D"], ["b", "Normal age-related decrease in serum calcium"], ["c", "Possible occurrence of osteoporosis or osteopenia"], ["d", "Potential for metastatic cancer or Paget disease"], ["e", "Recent bone fracture in a healing stage"]], "ans": ["b", "c"], "rat": "This slightly low calcium level could be an age-related decrease in serum calcium or could indicate a metabolic bone disease, such as osteoporosis or osteopenia. A good dietary intake would be expected to produce normal values. Metastatic cancer, Paget disease, or healing bone fractures will elevate calcium.", "topic": "Musculoskeletal assessment, Diagnostic tests"}, {"module": 10, "ch": 44, "chTitle": "Assessment of the Musculoskeletal System", "num": 4, "type": "Multiple Response", "q": "When assessing gait, what feature(s) would the nurse inspect? (Select all that apply.)", "opts": [["a", "Balance"], ["b", "Ease of stride"], ["c", "Goniometer readings"], ["d", "Length of stride"], ["e", "Steadiness"]], "ans": ["a", "b", "d", "e"], "rat": "To assess gait, look at balance, ease and length of stride, and steadiness. Goniometer readings assess flexion and extension or joint range of motion.", "topic": "Musculoskeletal assessment, Gait"}, {"module": 10, "ch": 44, "chTitle": "Assessment of the Musculoskeletal System", "num": 5, "type": "Multiple Response", "q": "The nurse takes a history on a male client reporting chronic back pain. Which factor(s) in the client’s history may have contributed to his pain? (Select all that apply.)", "opts": [["a", "Had a motor vehicle crash 10 years ago."], ["b", "Played football in college and high school."], ["c", "Has installed carpet and other flooring for 30 years."], ["d", "Typically takes walks 3 to 4 days each week."], ["e", "Eats two servings of dark, green leafy vegetables daily."]], "ans": ["a", "b", "c"], "rat": "A history of trauma caused by an accident, occupation, or contact sports can result in chronic back pain. Regular exercise and diet helps to promote bone health.", "topic": "Musculoskeletal assessment, History"}, {"module": 10, "ch": 45, "chTitle": "Concepts of Care for Patients With Musculoskeletal Problems", "num": 1, "type": "Multiple Choice", "q": "A client has a bone density score of –2.8. What intervention would the nurse anticipate based on this assessment?", "opts": [["a", "Asking the client to complete a food diary"], ["b", "Planning to teach about bisphosphonates"], ["c", "Scheduling another scan in 2 years"], ["d", "Scheduling another scan in 6 months"]], "ans": ["b"], "rat": "A T-score from a bone density scan at or lower than –2.5 indicates osteoporosis. The nurse would plan to teach about medications used to treat this disease, such as the bisphosphonates. A food diary is helpful to determine if the client gets adequate calcium and vitamin D, but at this point, dietary changes will not prevent the disease. Simply scheduling another scan will not help treat the disease either.", "topic": "Musculoskeletal disorders, Health teaching"}, {"module": 10, "ch": 45, "chTitle": "Concepts of Care for Patients With Musculoskeletal Problems", "num": 2, "type": "Multiple Choice", "q": "The nurse teaches assistive personnel (AP) about care of an older adult diagnosed with osteoporosis. What teaching would the nurse include?", "opts": [["a", "“Teach the client to eat high-calcium foods in the diet.”"], ["b", "“Assist the client with activities of daily living.”"], ["c", "“Osteoporosis places the client is at risk for fractures.”"], ["d", "“The client should stay in bed to prevent falling.”"]], "ans": ["c"], "rat": "Anyone who has osteoporosis is at risk for fragility fractures even if he or she does not experience trauma like a fall. The client needs to keep active rather than stay in bed where more bone could be lost. High-calcium foods may not be helpful because bone loss is already severe. There is no indication that the client needs assistance with ADLs.", "topic": "Musculoskeletal disorders, Osteoporosis"}, {"module": 10, "ch": 45, "chTitle": "Concepts of Care for Patients With Musculoskeletal Problems", "num": 3, "type": "Multiple Choice", "q": "A client has been advised to perform weight-bearing exercises to help slow bone loss, but has not followed this advice. What response by the nurse is appropriate at this time?", "opts": [["a", "Ask the client about fear of falling."], ["b", "Instruct the client to increase calcium."], ["c", "Suggest other exercises the client can do."], ["d", "Tell the client to try weight lifting."]], "ans": ["a"], "rat": "Fear of falling can limit participation in activity. The nurse would first assess if the client has this fear and then offer suggestions for dealing with it. The client may or may not need extra calcium, other exercises, or weight lifting.", "topic": "Musculoskeletal disorders, Osteoporosis"}, {"module": 10, "ch": 45, "chTitle": "Concepts of Care for Patients With Musculoskeletal Problems", "num": 4, "type": "Multiple Choice", "q": "The nurse is caring for several clients with osteoporosis. For which client would bisphosphonates not be a good option?", "opts": [["a", "Client with diabetes who has a serum creatinine of 0.8 mg/dL (61 mcmol/L)."], ["b", "Client who recently fell and has vertebral compression fractures."], ["c", "Hypertensive client who takes calcium channel blockers."], ["d", "Client with a spinal cord injury who cannot tolerate sitting up."]], "ans": ["d"], "rat": "Clients on bisphosphonates must be able to sit upright for 30 to 60 minutes after taking them. The client who cannot tolerate sitting up is not a good candidate for this class of drug. Poor renal function also makes clients poor candidates for this drug, but the client with a creatinine of 0.8 mg/dL (61 mcmol/L) is within normal range. Diabetes and hypertension are not related unless the client also has renal disease. The client who recently fell and sustained fractures is a good candidate for this drug if the fractures are related to osteoporosis.", "topic": "Musculoskeletal disorders, Drug therapy"}, {"module": 10, "ch": 45, "chTitle": "Concepts of Care for Patients With Musculoskeletal Problems", "num": 5, "type": "Multiple Choice", "q": "A client has been prescribed denosumab. What health teaching about this drug is most appropriate for the nurse to include?", "opts": [["a", "“Drink at least 8 ounces (240 mL) of water with it.”"], ["b", "“Make appointments to come get your injection.”"], ["c", "“Sit upright for 30 to 60 minutes after taking it.”"], ["d", "“Take the drug on an empty stomach.”"]], "ans": ["b"], "rat": "Denosumab is given by subcutaneous injection twice a year. The client does not need to drink 8 ounces (240 mL) of water with this medication as it is not taken orally. The client does not need to remain upright for 30 to 60 minutes after taking this medication, nor does the client need to take the drug on an empty stomach.", "topic": "Musculoskeletal disorders, Drug therapy"}, {"module": 10, "ch": 45, "chTitle": "Concepts of Care for Patients With Musculoskeletal Problems", "num": 6, "type": "Multiple Choice", "q": "The nurse is performing an assessment of a client with possible plantar fasciitis in the right foot. What assessment finding would the nurse expect in the right foot?", "opts": [["a", "Multiple toe deformities"], ["b", "Numbness and paresthesias"], ["c", "Severe pain in the arch of the foot"], ["d", "Redness and severe swelling"]], "ans": ["c"], "rat": "The most common assessment finding is the client’s report of severe pain in the arch of the foot, especially when walking. The other findings are not typical in clients with this health problem.", "topic": "Musculoskeletal disorders, Plantar fasciitis"}, {"module": 10, "ch": 45, "chTitle": "Concepts of Care for Patients With Musculoskeletal Problems", "num": 7, "type": "Multiple Choice", "q": "The nurse is caring for a young client who has been diagnosed with osteopenia. Which risk factor in the client’s history most likely contributed to the bone loss?", "opts": [["a", "Osteoarthritis"], ["b", "Hypothyroidism"], ["c", "Addison disease"], ["d", "Rheumatoid arthritis"]], "ans": ["d"], "rat": "Rheumatoid arthritis often occurs in young female adults and can lead to osteoporosis as a common complication. Cushing disease (rather than Addison disease) and hyperthyroidism (rather than hypothyroidism) are also risk factors. Osteoarthritis is a joint disease.", "topic": "Musculoskeletal disorders, Osteopenia"}, {"module": 10, "ch": 45, "chTitle": "Concepts of Care for Patients With Musculoskeletal Problems", "num": 8, "type": "Multiple Choice", "q": "An older client with diabetes is admitted with a heavily draining leg wound. The client’s white blood cell count is 38,000/mm3 (3
