8  109/L) but the client is afebrile. Which nursing action is most appropriate at this time?", "opts": [["a", "Administer acetaminophen as needed."], ["b", "Educate the client on amputation."], ["c", "Place the client on Contact Precautions."], ["d", "Refer the client to the wound care nurse."]], "ans": ["c"], "rat": "In the presence of a heavily draining wound, the nurse would place the client on Contact Precautions. If the client has discomfort, acetaminophen can be used, but this client has not reported pain and is afebrile. The client may or may not need an amputation in the future. The wound care nurse may be consulted but not as the most appropriate action.", "topic": "Musculoskeletal disorders, Transmission-Based Precautions"}, {"module": 10, "ch": 45, "chTitle": "Concepts of Care for Patients With Musculoskeletal Problems", "num": 9, "type": "Multiple Choice", "q": "A nurse is caring for four clients. After the hand-off report, which client would the nurse see first?", "opts": [["a", "Client with osteoporosis and a white blood cell count of 27,000/mm3 (27  109/L)"], ["b", "Client with osteoporosis and a bone fracture who requests pain medication"], ["c", "Post-microvascular bone transfer client whose distal leg is cool and pale"], ["d", "Client with suspected bone tumor who just returned from having a spinal CT"]], "ans": ["c"], "rat": "This client is the priority because the assessment findings indicate a critical lack of perfusion. A high white blood cell count is an expected finding for the client with osteoporosis. The client requesting pain medication should be seen second. The client who just returned from a CT scan is stable and needs no specific postprocedure care.", "topic": "Musculoskeletal disorders, Nursing assessment"}, {"module": 10, "ch": 45, "chTitle": "Concepts of Care for Patients With Musculoskeletal Problems", "num": 10, "type": "Multiple Choice", "q": "A client has a metastatic bone tumor in the left leg. What action by the nurse is appropriate?", "opts": [["a", "Administer pain medication as prescribed."], ["b", "Elevate the extremity and apply moist heat."], ["c", "Teach the client about amputation care."], ["d", "Place the client on protective precautions."]], "ans": ["a"], "rat": "Pain medication should be given to control metastatic bone pain. Elevation and heat may or may not be helpful. Protective precautions are not needed for this client.", "topic": "Musculoskeletal disorders, Cancer"}, {"module": 10, "ch": 45, "chTitle": "Concepts of Care for Patients With Musculoskeletal Problems", "num": 11, "type": "Multiple Choice", "q": "A client with bone cancer is hospitalized for a limb salvage procedure. How can the nurse best address the client’s psychosocial needs?", "opts": [["a", "Assess the client’s coping skills and support systems."], ["b", "Explain that the surgery leads to a longer life expectancy."], ["c", "Refer the client to the social worker or hospital chaplain."], ["d", "Reinforce physical therapy to aid with ambulating normally."]], "ans": ["a"], "rat": "The first step in the nursing process is assessment. The nurse would assess coping skills and possible support systems that will be helpful in this client’s treatment. Explaining that a limb salvage procedure will extend life does not address the client’s psychosocial needs. Referrals may be necessary, but the nurse should assess first. Reinforcing physical therapy is also helpful but again does not address the psychosocial needs of the client.", "topic": "Musculoskeletal disorders, Psychosocial response"}, {"module": 10, "ch": 45, "chTitle": "Concepts of Care for Patients With Musculoskeletal Problems", "num": 12, "type": "Multiple Choice", "q": "A client had a bunionectomy with osteotomy. The client asks why healing may take up to 3 months. What explanation by the nurse is best?", "opts": [["a", "“The bones in your feet are hard to operate on.”"], ["b", "“The surrounding bones and tissue are damaged.”"], ["c", "“Your feet have less blood flow, so healing is slower.”"], ["d", "“Your feet bear weight so they never really heal.”"]], "ans": ["c"], "rat": "The feet are the most distal to the heart and receive less blood flow than other organs and tissues, prolonging the healing time after surgery. The other explanations are not correct.", "topic": "Musculoskeletal disorders, Health teaching"}, {"module": 10, "ch": 45, "chTitle": "Concepts of Care for Patients With Musculoskeletal Problems", "num": 13, "type": "Multiple Choice", "q": "A nurse assesses clients in an osteoporosis clinic. Which client would the nurse assess first?", "opts": [["a", "Client taking calcium with vitamin D who reports flank pain 2 weeks ago."], ["b", "Client taking ibandronate who cannot remember when the last dose was."], ["c", "Client taking raloxifene who reports unilateral calf swelling."], ["d", "Client taking risedronate who reports occasional dyspepsia."]], "ans": ["c"], "rat": "The client on raloxifene needs to be assessed first because of the potential for deep vein thrombosis, which is an adverse effect of raloxifene. The client with flank pain may have had a kidney stone but is not acutely ill now. The client who cannot remember taking the last dose of ibandronate can be seen last. The client on risedronate may need to change medications.", "topic": "Musculoskeletal disorders, Drug therapy"}, {"module": 10, "ch": 45, "chTitle": "Concepts of Care for Patients With Musculoskeletal Problems", "num": 14, "type": "Multiple Choice", "q": "What information does the nurse teach a women’s group about osteoporosis?", "opts": [["a", "“Primary osteoporosis occurs in postmenopausal women due to lack of estrogen.”"], ["b", "“Men actually have higher rates of the disease but are underdiagnosed.”"], ["c", "“There is no way to prevent or slow osteoporosis after menopause.”"], ["d", "“Women and men have an equal chance of getting osteoporosis.”"]], "ans": ["a"], "rat": "Women are more at risk of developing primary osteoporosis after menopause due to the lack of estrogen. Men have a slower loss of bone after the age of 75. Many treatments are now available for women to slow osteoporosis after menopause.", "topic": "Musculoskeletal disorders, Osteoporosis"}, {"module": 10, "ch": 45, "chTitle": "Concepts of Care for Patients With Musculoskeletal Problems", "num": 15, "type": "Multiple Choice", "q": "A client with osteoporosis is going home where the client lives alone. What action by the nurse is best?", "opts": [["a", "Refer the client to Meals on Wheels."], ["b", "Arrange a home safety evaluation."], ["c", "Ensure that the client has a walker at home."], ["d", "Help the client look into assisted living."]], "ans": ["b"], "rat": "This client has several risk factors that place him or her at a high risk for falling. The nurse should consult social work or home health care to conduct a home safety evaluation. The other options may or may not be needed based upon the client’s condition at discharge.", "topic": "Musculoskeletal disorders, Osteoporosis"}, {"module": 10, "ch": 45, "chTitle": "Concepts of Care for Patients With Musculoskeletal Problems", "num": 1, "type": "Multiple Response", "q": "A nurse is assessing a community group for dietary factors that contribute to osteoporosis. In addition to inquiring about calcium, the nurse also assesses for which other dietary components? (Select all that apply.)", "opts": [["a", "Alcohol"], ["b", "Caffeine"], ["c", "Fat"], ["d", "Carbonated beverages"], ["e", "Vitamin D"]], "ans": ["a", "b", "d", "e"], "rat": "Dietary components that affect the development of osteoporosis include alcohol, caffeine, high phosphorus intake, carbonated beverages, and vitamin D. Tobacco is also a contributing lifestyle factor. Fat intake does not contribute to osteoporosis.", "topic": "Musculoskeletal disorders, Osteoporosis"}, {"module": 10, "ch": 45, "chTitle": "Concepts of Care for Patients With Musculoskeletal Problems", "num": 2, "type": "Multiple Response", "q": "A nurse is providing education to a community women’s group about lifestyle changes helpful in preventing osteoporosis. What topics does the nurse cover? (Select all that apply.)", "opts": [["a", "Cut down on tobacco product use."], ["b", "Limit alcohol to two drinks a day."], ["c", "Strengthening exercises are important."], ["d", "Take recommended calcium and vitamin D."], ["e", "Walk for 30 minutes at least three times a week."]], "ans": ["c", "d", "e"], "rat": "Lifestyle changes can be made to decrease the occurrence of osteoporosis and include strengthening and weight-bearing exercises and getting the recommended amounts of both calcium and vitamin D. Tobacco should be totally avoided. Women should not have more than one drink per day.", "topic": "Musculoskeletal disorders, Osteoporosis"}, {"module": 10, "ch": 45, "chTitle": "Concepts of Care for Patients With Musculoskeletal Problems", "num": 3, "type": "Multiple Response", "q": "A client with chronic osteomyelitis is being discharged from the hospital. What information is important for the nurse to teach this client and family? (Select all that apply.)", "opts": [["a", "Adherence to the antibiotic regimen"], ["b", "Correct intramuscular injection technique"], ["c", "Eating high-protein and high-carbohydrate foods"], ["d", "Keeping daily follow-up appointments"], ["e", "Proper use of the intravenous equipment"]], "ans": ["a", "c", "e"], "rat": "The client going home with chronic osteomyelitis will need long-term antibiotic therapy— first intravenous, and then oral. The client needs education on how to properly administer IV antibiotics, care for the IV line, adhere to the regimen, and eat a healthy diet toencourage wound healing. The antibiotics are not given by IM injection. The client does not need daily follow-up.", "topic": "Musculoskeletal disorders, Osteomyelitis"}, {"module": 10, "ch": 45, "chTitle": "Concepts of Care for Patients With Musculoskeletal Problems", "num": 4, "type": "Multiple Response", "q": "The nurse is assessing a client for chronic osteomyelitis. Which features distinguish this from the acute form of the disease? (Select all that apply.)", "opts": [["a", "Draining sinus tracts"], ["b", "High fevers"], ["c", "Presence of foot ulcers"], ["d", "Swelling and redness"], ["e", "Tenderness or pain"]], "ans": ["a", "c"], "rat": "Draining sinus tracts and foot ulcers are seen in chronic osteomyelitis. High fever, swelling, and redness are more often seen in acute osteomyelitis. Pain or tenderness can be in either case.", "topic": "Musculoskeletal disorders, Osteomyelitis"}, {"module": 10, "ch": 45, "chTitle": "Concepts of Care for Patients With Musculoskeletal Problems", "num": 5, "type": "Multiple Response", "q": "The nurse reviews a list of drugs that can cause secondary osteoporosis.Which drugs are most commonly associated with this health problem? (Select all that apply.)", "opts": [["a", "Antianxiety agents"], ["b", "Antibiotics"], ["c", "Barbiturates"], ["d", "Corticosteroids"], ["e", "Loop diuretics"]], "ans": ["c", "d", "e"], "rat": "Several classes of drugs can cause secondary osteoporosis, including barbiturates, corticosteroids, and loop diuretics. Antianxiety agents and antibiotics are not associated with the formation of osteoporosis.", "topic": "Musculoskeletal disorders, Drug therapy"}, {"module": 10, "ch": 46, "chTitle": "Concepts of Care for Patients With Arthritis and Total Joint Arthroplasty", "num": 1, "type": "Multiple Choice", "q": "The nurse is caring for a client who has severe osteoarthritis. What primary joint problems will the nurse expect the client to report?", "opts": [["a", "Crepitus"], ["b", "Effusions"], ["c", "Pain"], ["d", "Deformities"]], "ans": ["c"], "rat": "The primary assessment finding typically reported by clients who have osteoarthritis is joint pain, although crepitus, effusions (fluid), and mild deformities may occur.", "topic": "Osteoarthritis, Signs and symptoms"}, {"module": 10, "ch": 46, "chTitle": "Concepts of Care for Patients With Arthritis and Total Joint Arthroplasty", "num": 2, "type": "Multiple Choice", "q": "A nurse is teaching a client newly diagnosed with osteoarthritis (OA) about drugs used to treat the disease. For which drug does the nurse plan health teaching?", "opts": [["a", "Acetaminophen"], ["b", "Cyclobenzaprine hydrochloride"], ["c", "Hyaluronate"], ["d", "Ibuprofen"]], "ans": ["a"], "rat": "All of these drugs may be appropriate to treat OA. However, the first-line drug is acetaminophen. Cyclobenzaprine is a muscle relaxant given to treat muscle spasms. Hyaluronate is a synthetic joint fluid implant. Ibuprofen is a nonsteroidal anti-inflammatory drug.", "topic": "Osteoarthritis, Drug therapy"}, {"module": 10, "ch": 46, "chTitle": "Concepts of Care for Patients With Arthritis and Total Joint Arthroplasty", "num": 3, "type": "Multiple Choice", "q": "The nurse assesses a client with diabetes and osteoarthritis (OA) during a checkup. The nurse notes the client’s blood glucose readings have been elevated. What question by the nurse is most appropriate?", "opts": [["a", "“Are you following the prescribed diabetic diet?”"], ["b", "“Have you been taking glucosamine supplements?”"], ["c", "“How much exercise do you really get each week?”"], ["d", "“You’re still taking your diabetic medication, right?”"]], "ans": ["b"], "rat": "All of the topics are appropriate for a client whose blood glucose readings have been higher than usual. However, since this client also has OA, and glucosamine can increase blood glucose levels, the nurse would ask about its use. The other questions all have an element of nontherapeutic communication in them. Asking how much exercise the client “really” gets is or if the diet is being followed is accusatory. Asking if the client takes his or her medications “right?” is patronizing.", "topic": "Osteoarthritis, Nursing assessment"}, {"module": 10, "ch": 46, "chTitle": "Concepts of Care for Patients With Arthritis and Total Joint Arthroplasty", "num": 4, "type": "Multiple Choice", "q": "The nurse interviews an older client with moderate osteoarthritis and her husband. What psychosocial assessment question would the nurse include?", "opts": [["a", "“Do you feel like hurting yourself or others?”"], ["b", "“Are you planning to retire due to your disease?”"], ["c", "“Do you ask your husband for assistance?”"], ["d", "“Do you experience discomfort during sex?”"]], "ans": ["d"], "rat": "Although some clients can become depressed and anxious as a result of having OA, suicidal ideation is not common. The nurse should not assume that an older adult will want to retire or that the client will need help from her husband. Many clients avoid sexual intercourse because of joint pain and stiffness.", "topic": "Osteoarthritis, Psychosocial assessment"}, {"module": 10, "ch": 46, "chTitle": "Concepts of Care for Patients With Arthritis and Total Joint Arthroplasty", "num": 5, "type": "Multiple Choice", "q": "The nurse assesses a client after a total hip arthroplasty. The client’s surgical leg is visibly shorter than the other one and the client reports extreme pain. While a co-worker calls the surgeon, what action by the nurse is appropriate?", "opts": [["a", "Assess neurovascular status in both legs."], ["b", "Elevate the surgical leg and apply ice."], ["c", "Prepare to administer pain medication."], ["d", "Try to place the surgical leg in abduction."]], "ans": ["a"], "rat": "This client has signs and symptoms of hip dislocation, a potential complication of this surgery. Hip dislocation can cause neurovascular compromise. The nurse would assess neurovascular status while comparing both legs. The nurse would not try to move the extremity to elevate or abduct it. Pain medication may be administered if possible, but first the nurse would thoroughly assess the client.", "topic": "Total joint arthroplasty, Perioperative care"}, {"module": 10, "ch": 46, "chTitle": "Concepts of Care for Patients With Arthritis and Total Joint Arthroplasty", "num": 6, "type": "Multiple Choice", "q": "The nurse is teaching a client who is prescribed acetaminophen for control of osteoarthritic joint pain. What statement by the client indicates a need for further teaching?", "opts": [["a", "“I won’t take more than 5000 mg of this drug each day.”"], ["b", "“I’ll follow up to get my lab tests done to check my liver.”"], ["c", "“I’ll check drugs that I take for acetaminophen in them.”"], ["d", "“I can use topical patches and creams to help relieve pain.”"]], "ans": ["a"], "rat": "All of the choices are correct about acetaminophen except that the maximum daily dosage is 4000 mg. For older adults, 3000 mg are recommended due to slower drug metabolism by the liver.", "topic": "Osteoarthritis, Drug therapy"}, {"module": 10, "ch": 46, "chTitle": "Concepts of Care for Patients With Arthritis and Total Joint Arthroplasty", "num": 7, "type": "Multiple Choice", "q": "After a total knee arthroplasty, a client is on the postoperative nursing unit with a continuous femoral nerve blockade. On assessment, the nurse notes the skin of both legs is pale pink, warm, and dry, but the client is unable to dorsiflex or plantarflex the surgical foot. What action would the nurse take next?", "opts": [["a", "Document the findings and monitor as prescribed."], ["b", "Increase the frequency of monitoring the client."], ["c", "Notify the surgeon or anesthesia provider immediately."], ["d", "Palpate the client’s bladder or perform a bladder scan."]], "ans": ["c"], "rat": "With the femoral nerve block, the client would still be able to dorsiflex and plantarflex the affected surgical foot. Since this client has an abnormal finding, the nurse would notify either the surgeon or the anesthesia provider immediately. Documentation is the last priority. Increasing the frequency of assessment may be appropriate, but first the nurse must notify the appropriate provider. Palpating the bladder is not related.", "topic": "Total joint arthroplasty, Perioperative care"}, {"module": 10, "ch": 46, "chTitle": "Concepts of Care for Patients With Arthritis and Total Joint Arthroplasty", "num": 8, "type": "Multiple Choice", "q": "A client is prescribed celecoxib for joint pain. What statement by the client indicates a need for further teaching?", "opts": [["a", "“I’ll report any signs of bleeding or bruising to my primary health care provider.”"], ["b", "“I’ll take this drug only as prescribed by my primary health care provider.”"], ["c", "“I’ll be sure to take this drug three times a day only on an empty stomach.”"], ["d", "“I’ll monitor the amount of urine that I excrete every day and report any changes.”"]], "ans": ["c"], "rat": "All of the choices are correct for this NSAID except that celecoxib can cause GI distress unless taken with meals or food. The drug should not be taken on an empty stomach and is rarely taken more than twice a day.", "topic": "Arthritis, Drug therapy"}, {"module": 10, "ch": 46, "chTitle": "Concepts of Care for Patients With Arthritis and Total Joint Arthroplasty", "num": 9, "type": "Multiple Choice", "q": "The nurse is teaching a client who is planning to have a total hip arthroplasty. What statement by the client indicates a need for further teaching?", "opts": [["a", "“I will get an IV antibiotic right before surgery to prevent infection.”"], ["b", "“I may request a regional nerve block as part of the surgical anesthesia.”"], ["c", "“I will receive IV heparin before surgery to decrease the risk of clots.”"], ["d", "“I will receive tranexamic acid to help reduce blood loss during surgery.”"]], "ans": ["c"], "rat": "All of the choices are correct except that IV heparin is not given before or after surgery. A different anticoagulant is given after surgery to prevent postoperative venous thromboembolism, such as deep vein thrombosis and pulmonary embolus.", "topic": "Total hip arthroplasty, Perioperative care"}, {"module": 10, "ch": 46, "chTitle": "Concepts of Care for Patients With Arthritis and Total Joint Arthroplasty", "num": 10, "type": "Multiple Choice", "q": "A client asks the nurse about having a total knee arthroplasty to relieve joint pain. Which factor would place the client at the highest risk for impaired postoperative healing?", "opts": [["a", "Controlled hypertension"], ["b", "Obesity"], ["c", "Osteoarthritis"], ["d", "Mild osteopenia"]], "ans": ["b"], "rat": "Obesity places a client at high risk for many postoperative complications including slower wound and bone healing. The other factors usually do not affect healing after surgery.", "topic": "Total knee arthroplasty, Perioperative care"}, {"module": 10, "ch": 46, "chTitle": "Concepts of Care for Patients With Arthritis and Total Joint Arthroplasty", "num": 11, "type": "Multiple Choice", "q": "A nurse assesses a group of clients who have rheumatoid arthritis (RA). Which client would the nurse see first?", "opts": [["a", "Client who reports jaw pain when eating"], ["b", "Client with a red, hot, swollen right wrist"], ["c", "Client who has a puffy-looking area behind the knee"], ["d", "Client with a worse joint deformity since the last visit"]], "ans": ["b"], "rat": "All of the options are possible manifestations of RA. However, the presence of one joint that is much redder, hotter, or more swollen that the other joints may indicate infection or an exacerbation of the RA disease process. The nurse needs to see this client first.", "topic": "Rheumatoid arthritis, Signs and symptoms"}, {"module": 10, "ch": 46, "chTitle": "Concepts of Care for Patients With Arthritis and Total Joint Arthroplasty", "num": 12, "type": "Multiple Choice", "q": "The nurse assesses a client with rheumatoid arthritis (RA) and Sjögren syndrome. What assessment would be most important for this client?", "opts": [["a", "Abdominal assessment"], ["b", "Oxygen saturation"], ["c", "Breath sounds"], ["d", "Visual acuity"]], "ans": ["d"], "rat": "Sjögren syndrome may be seen in clients with RA and manifests with dryness of the eyes, mouth, and vagina in females. Visual disturbances can occur. The other assessments are not related to Sjögren syndrome.", "topic": "Rheumatoid arthritis, Nursing assessment"}, {"module": 10, "ch": 46, "chTitle": "Concepts of Care for Patients With Arthritis and Total Joint Arthroplasty", "num": 13, "type": "Multiple Choice", "q": "A client who has rheumatoid arthritis is prescribed etanercept. What health teaching by the nurse about this drug is appropriate?", "opts": [["a", "Giving subcutaneous injections"], ["b", "Having a chest x-ray once a year"], ["c", "Taking the medication with food"], ["d", "Using heat on the injection site"]], "ans": ["a"], "rat": "Etanercept is given as a subcutaneous injection twice a week. The nurse would teach the client how to self-administer the medication. The other options are not appropriate for etanercept.", "topic": "Rheumatoid arthritis, Drug therapy"}, {"module": 10, "ch": 46, "chTitle": "Concepts of Care for Patients With Arthritis and Total Joint Arthroplasty", "num": 14, "type": "Multiple Choice", "q": "A client with rheumatoid arthritis (RA) has an acutely swollen, red, and painful joint. What nonpharmacologic intervention does the nurse recommend?", "opts": [["a", "Heating pad"], ["b", "Ice packs"], ["c", "Splint"], ["d", "Paraffin dip"]], "ans": ["b"], "rat": "Ice is best for acute inflammation. Heat often helps with joint stiffness. Splinting helps preserve joint function. A paraffin dip is used to provide warmth to the joint which is more appropriate for chronic pain and stiffness.", "topic": "Rheumatoid arthritis, Pain management"}, {"module": 10, "ch": 46, "chTitle": "Concepts of Care for Patients With Arthritis and Total Joint Arthroplasty", "num": 15, "type": "Multiple Choice", "q": "A client is scheduled to have a total hip arthroplasty. What preoperative teaching by the nurse is most important?", "opts": [["a", "Teach the need to discontinue all medications for 5 days before surgery."], ["b", "Teach the patient about foods high in protein, Vitamin C, and iron."], ["c", "Explain to the client the possible need for blood transfusions postoperatively."], ["d", "Remind the client to have all dental procedures completed at least 2 weeks prior to surgery."]], "ans": ["d"], "rat": "The nurse would include teaching about dental procedures to avoid infection after new joint has been inserted. Planned procedures would be completed at least 2 weeks before surgery and the client will need to tell any future primary health care providers about having a total joint arthroplasty. Only home medications prescribed that increase the risk for bleeding or clotting need to be discontinued 5 to 10 days before surgery. Clients need to be aware that any postoperative anemia may need to be treated with a blood transfusion, but it is not the most important. Diets high in protein, Vitamin C, and iron help with tissue repair, but are not the most important.", "topic": "Total joint arthroplasty, Perioperative care"}, {"module": 10, "ch": 46, "chTitle": "Concepts of Care for Patients With Arthritis and Total Joint Arthroplasty", "num": 16, "type": "Multiple Choice", "q": "A client is getting out of bed into the chair for the first time after an uncemented total hip arthroplasty. What action by the nurse is appropriate?", "opts": [["a", "Have adequate help to transfer the patient."], ["b", "Provide socks so the patient can slide easier."], ["c", "Tell the patient full weight bearing is allowed."], ["d", "Use a footstool to elevate the patient’s leg."]], "ans": ["a"], "rat": "The client with an uncemented hip will be on toe-touch only after surgery. The nurse would ensure there is adequate help to transfer the patient while preventing falls. Slippery socks may cause a fall. Elevating the leg is not going to assist with the client’s transfer.", "topic": "Total joint arthroplasty, Safety"}, {"module": 10, "ch": 46, "chTitle": "Concepts of Care for Patients With Arthritis and Total Joint Arthroplasty", "num": 17, "type": "Multiple Choice", "q": "A client has long-term rheumatoid arthritis that especially affects the hands. The client wants to finish quilting a baby blanket before the birth of her grandchild. What response by the nurse is appropriate?", "opts": [["a", "“Let’s ask your provider about increasing your pain pills.”"], ["b", "“Hold ice bags against your hands before quilting.”"], ["c", "“Try a paraffin wax dip 20 minutes before you quilt.”"], ["d", "“You need to stop quilting before it destroys your fingers.”"]], "ans": ["c"], "rat": "Paraffin wax dips are beneficial for decreasing pain in arthritic hands and lead to increased mobility. Increasing pain pills may not help with movement. Ice has limited use unless the client has a “hot” or exacerbated joint. The client wants to finish the project, so the nurse would not negate its importance by telling the client it is destroying her joints.", "topic": "Rheumatoid arthritis, Pain management, Heat"}, {"module": 10, "ch": 46, "chTitle": "Concepts of Care for Patients With Arthritis and Total Joint Arthroplasty", "num": 18, "type": "Multiple Choice", "q": "A client has a left knee arthrocentesis to remove excess joint fluid. What postprocedure health teaching will the nurse include?", "opts": [["a", "“Take your opioid medication as prescribed by the primary health care provider.”"], ["b", "“Do not bear weight on your left leg for at least a week after you get home.”"], ["c", "“Monitor the site for bleeding or clear fluid leakage when you are home.”"], ["d", "“Tell your employer that you can’t come back to work for 2 to 3 weeks.”"]], "ans": ["c"], "rat": "An arthrocentesis is performed as an ambulatory procedure and may require a mild analgesic such as acetaminophen for discomfort. Opioids are not used. The client may bear weight and return to work, but needs to monitor for bleeding or leakage of synovial fluid at the injection site.", "topic": "Arthritis, Diagnostic tests"}, {"module": 10, "ch": 46, "chTitle": "Concepts of Care for Patients With Arthritis and Total Joint Arthroplasty", "num": 19, "type": "Multiple Choice", "q": "The primary health care provider prescribes methotrexate (MTX) for a client with a new diagnosis of rheumatoid arthritis. The nurse provides health teaching about the drug. What statement by the nurse is appropriate to include about methotrexate?", "opts": [["a", "“It will take at least 1 to 2 weeks for the drug to help relieve your symptoms.”"], ["b", "“The drug is very expensive but there are pharmacy plans to help pay for it.”"], ["c", "“The drug can increase your risk for infection, so you should avoid crowds.”"], ["d", "“It’s OK for you to drink about 2 to 3 glasses of wine each week while taking the drug.”"]], "ans": ["c"], "rat": "MTX takes up to 4 to 6 weeks to begin to help relieve RA symptoms and is very inexpensive. Clients should avoid alcohol due to the potential for liver toxicity. MTX suppresses the immune system which makes clients susceptible to infection. The nurse teaches clients to avoid crowds and anyone with a known infection.", "topic": "Rheumatoid arthritis, Drug therapy"}, {"module": 10, "ch": 46, "chTitle": "Concepts of Care for Patients With Arthritis and Total Joint Arthroplasty", "num": 1, "type": "Multiple Response", "q": "The nurse is assessing a client with long-term rheumatoid arthritis (RA) who has been taking prednisone for 10 years. For which complications of chronic drug therapy would the nurse assess? (Select all that apply.)", "opts": [["a", "Osteoporosis"], ["b", "Diabetes mellitus"], ["c", "Glaucoma"], ["d", "Hypertension"], ["e", "Hypokalemia"], ["f", "Decreased immunity"]], "ans": ["a", "b", "c", "d", "e", "f"], "rat": "Prednisone is a corticosteroid that is sometimes used for autoimmune disorders like RA when other drugs are not effective or cannot be tolerated. However, it can cause many complications when used long-term, including all of the health problems listed in the choices.", "topic": "Rheumatoid arthritis, Drug therapy"}, {"module": 10, "ch": 46, "chTitle": "Concepts of Care for Patients With Arthritis and Total Joint Arthroplasty", "num": 2, "type": "Multiple Response", "q": "The nurse is teaching a client with mild rheumatoid arthritis (RA) about how to protect synovial joints. Which health teaching will the nurse include? (Select all that apply.)", "opts": [["a", "“Use small joints rather than larger ones during tasks.”"], ["b", "“Use both hands instead of one with holding objects.”"], ["c", "“When getting out of bed or a chair, use the palms of your hands.”"], ["d", "“Bend your knees instead of your waist and keep your back straight.”"], ["e", "“Do not use multiple pillows under your head to prevent neck flexion.”"], ["f", "“Use a device or rubber grip to open jars or bottle tops.”"], ["g", "“Use long-handled devices such as a hairbrush with an extended handle.”"]], "ans": ["b", "c", "d", "e", "f", "g"], "rat": "All of these options are part of health teaching for joint protection except that large joints should be used instead of smaller ones.", "topic": "Arthritis, Joint protection"}, {"module": 10, "ch": 46, "chTitle": "Concepts of Care for Patients With Arthritis and Total Joint Arthroplasty", "num": 3, "type": "Multiple Response", "q": "A client who had a recent total knee arthroplasty will be using a continuous passive motion (CPM) machine after discharge at home. What health teaching about the CPM machine will the nurse include? (Select all that apply.)", "opts": [["a", "“Keep the machine padded well to prevent skin breakdown.”"], ["b", "“Ensure that your leg is placed properly on the machine.”"], ["c", "“Use the machine as prescribed but not at mealtime.”"], ["d", "“When the machine is not being used, do not store it on the floor.”"], ["e", "“Check that the cycle and range of motion is kept at the level prescribed.”"]], "ans": ["a", "b", "c", "d", "e"], "rat": "Although not used as often today, some clients are prescribed to use the CPM machine to increase range of motion in the surgical knee. All of these teaching points are important for any client who uses a CPM machine.", "topic": "Total knee arthroplasty, Home care management"}, {"module": 10, "ch": 46, "chTitle": "Concepts of Care for Patients With Arthritis and Total Joint Arthroplasty", "num": 4, "type": "Multiple Response", "q": "The nurse assesses a client with long-term rheumatoid arthritis (RA) for late signs and symptoms. Which assessment findings will the nurse document as late signs and symptoms of RA? (Select all that apply.)", "opts": [["a", "Anorexia"], ["b", "Felty syndrome"], ["c", "Joint deformity"], ["d", "Low-grade fever"], ["e", "Weight loss"]], "ans": ["b", "c", "e"], "rat": "Late signs and symptoms of RA include Felty syndrome, joint deformity, weight loss, organ involvement, osteoporosis, extreme fatigue, and anemia, among others. Anorexia and low-grade fever are both seen early in the course of the disease.", "topic": "Rheumatoid arthritis, Nursing assessment"}, {"module": 10, "ch": 46, "chTitle": "Concepts of Care for Patients With Arthritis and Total Joint Arthroplasty", "num": 5, "type": "Multiple Response", "q": "The nurse is teaching assistive personnel about postoperative care for an older adult who had a posterolateral total hip arthroplasty. What teaching will the nurse include? (Select all that apply.)", "opts": [["a", "“Move the client slowly to prevent dizziness and a possible fall.”"], ["b", "“Encourage the client to deep breathe and cough at least every 2 hours.”"], ["c", "“Help the client use the incentive spirometer at least every 2 hours.”"], ["d", "“Keep the abduction pillow in place at all times while the client is in bed.”"], ["e", "“Let me know if the client has an elevated temperature or pulse.”"], ["f", "“Keep in mind that the client may be a little confused after surgery.”"], ["g", "“Please let me know if you see any reddened or open skin areas during bathing.”"]], "ans": ["a", "b", "c", "d", "e", "f"], "rat": "Older adults are at risk for complications of decreased mobility after surgery, including atelectasis, pneumonia, pressure injuries, and orthostatic hypotension. Therefore these precautions are to help keep the client safe and avoid complications that could be life threatening.", "topic": "Total hip arthroplasty, Perioperative care"}, {"module": 10, "ch": 46, "chTitle": "Concepts of Care for Patients With Arthritis and Total Joint Arthroplasty", "num": 6, "type": "Multiple Response", "q": "The nurse is caring for an older client who had a total knee arthroplasty. Prior to surgery, the client lived alone independently. With which interprofessional health care team members will the nurse collaborate to ensure positive client outcomes? (Select all that apply.)", "opts": [["a", "Case manager"], ["b", "Mental health counselor"], ["c", "Physical therapist"], ["d", "Occupational therapist"], ["e", "Speech–language pathologist"], ["f", "Clergy/Spiritual leader"]], "ans": ["a", "c"], "rat": "The client was independent and living alone prior to surgery but will likely need help for a short time at home. However, if the client was ADL independent, he or she will not need referral to an occupational therapist. Therefore, a case manager can assess the living situation and identify any special needs to be addressed. The physical therapist will help the client learn to ambulate independently with a walker. There is no indication that the client needs referral for mental, spiritual, or speech–language services.", "topic": "Total knee arthroplasty, Home care management"}, {"module": 10, "ch": 46, "chTitle": "Concepts of Care for Patients With Arthritis and Total Joint Arthroplasty", "num": 7, "type": "Multiple Response", "q": "A client asks the nurse about what medications may be included for nonopioid multimodal analgesia following a total knee arthroplasty. What medications may be given to the client? (Select all that apply.)", "opts": [["a", "Gabapentin"], ["b", "Ketorolac"], ["c", "Hydrocodone"], ["d", "Ketamine"], ["e", "Morphine"], ["f", "Bupivacaine"]], "ans": ["a", "b", "d", "f"], "rat": "All of the choices are appropriate to use for nonopioid multimodal analgesia except for the two opioid drugs—hydrocodone and morphine. The nonopioid medications are used to decrease inflammation and pain.", "topic": "Total knee arthroplasty, Drug therapy"}, {"module": 10, "ch": 46, "chTitle": "Concepts of Care for Patients With Arthritis and Total Joint Arthroplasty", "num": 8, "type": "Multiple Response", "q": "A client has rheumatoid arthritis (RA) and the nurse is conducting a home assessment. What options can the nurse suggest for the client to maintain independence in activities of daily living (ADLs)? (Select all that apply.)", "opts": [["a", "Grab bars to reach high items"], ["b", "Long-handled bath scrub brush"], ["c", "Soft rocker-recliner chair"], ["d", "Toothbrush with built-up handle"], ["e", "Wheelchair cushion for comfort"]], "ans": ["a", "b", "d"], "rat": "Grab bars, long-handled bath brushes, and toothbrushes with built-up handles all provide modifications for daily activities, making it easier for the client with RA to complete ADLs independently. The rocker-recliner and wheelchair cushion are comfort measures but do not help increase independence. Most clients who have RA are not wheelchair-bound.", "topic": "Rheumatoid arthritis, Activities of daily living"}, {"module": 10, "ch": 46, "chTitle": "Concepts of Care for Patients With Arthritis and Total Joint Arthroplasty", "num": 9, "type": "Multiple Response", "q": "A nurse is visiting a client discharged home after a total hip arthroplasty. What safety precautions would the nurse recommend to the client and family? (Select all that apply.)", "opts": [["a", "Buy and install an elevated toilet seat."], ["b", "Install grab bars in the shower and by the toilet."], ["c", "Step into the bathtub with the affected leg first."], ["d", "Remove all throw rugs throughout the house."], ["e", "Use a shower chair while taking a shower."]], "ans": ["a", "b", "d", "e"], "rat": "Buying and installing an elevated toilet seat, installing grab bars, removing throw rugs, and using a shower chair will all promote safety for this client. The client is still on partial weight bearing, so he or she cannot step into the bathtub leading with the operative side.", "topic": "Total joint arthroplasty, Home Management"}, {"module": 10, "ch": 46, "chTitle": "Concepts of Care for Patients With Arthritis and Total Joint Arthroplasty", "num": 10, "type": "Multiple Response", "q": "A nurse is planning postoperative care for a client following a total hip arthroplasty. What nursing interventions would help prevent venous thromboembolism for this client? (Select all that apply.)", "opts": [["a", "Early ambulation"], ["b", "Fluid restriction"], ["c", "Quadriceps-setting exercises"], ["d", "Compression stockings/devices"], ["e", "Anticoagulant drug therapy"]], "ans": ["a", "c", "d", "e"], "rat": "Early ambulation, leg exercises, and compression stockings/devices promote venous return and peripheral circulation which helps prevent deep vein thrombi. Anticoagulants such as subcutaneous low–molecular-weight heparin (LMWH) or factor Xa inhibitors are used for all clients who have a total lower extremity joint arthroplasty. The nurse would encourage fluids to expand blood volume and promote circulation; fluids would not be restricted.", "topic": "Total hip arthroplasty, Perioperative care"}, {"module": 10, "ch": 47, "chTitle": "Concepts of Care for Patients With Musculoskeletal Trauma", "num": 1, "type": "Multiple Choice", "q": "A client who had a surgical fractured femur repair reports new-onset shortness of breath and increased respirations. What is the nurse’s first action?", "opts": [["a", "Place the client in a high-Fowler position."], ["b", "Document the client’s oxygen saturation level."], ["c", "Start oxygen therapy at 2 L/min via nasal cannula."], ["d", "Contact the primary health care provider."]], "ans": ["a"], "rat": "The client is experiencing respiratory distress which could be due to pulmonary embolus, fat embolism syndrome, or anxiety. Regardless of the cause, the nurse would place the client in a sitting position first and then perform additional assessment. Oxygen would likely be needed, especially if the client’s oxygen saturation was under 95%.", "topic": "Fracture, Complications"}, {"module": 10, "ch": 47, "chTitle": "Concepts of Care for Patients With Musculoskeletal Trauma", "num": 2, "type": "Multiple Choice", "q": "A client who had a fractured ankle open reduction internal fixation (ORIF) 4 weeks ago reports burning pain and tingling in the affected foot. For which potential complication would the nurse anticipate?", "opts": [["a", "Delayed bone healing"], ["b", "Complex regional pain syndrome"], ["c", "Peripheral neuropathy"], ["d", "Compartment syndrome"]], "ans": ["b"], "rat": "Burning pain and tingling that occurs weeks or months after a fracture or other trauma may indicate complex regional pain syndrome. Compartment syndrome tends to occur within days of the initial injury.", "topic": "Fracture, Complications"}, {"module": 10, "ch": 47, "chTitle": "Concepts of Care for Patients With Musculoskeletal Trauma", "num": 3, "type": "Multiple Choice", "q": "An older client who fell at home is admitted to the emergency department and reports pain in her left groin and behind her left knee. What action would the nurse anticipate?", "opts": [["a", "Administer IV push morphine."], ["b", "Prepare for application of a leg cast."], ["c", "Begin oxygen at 6 L/min via mask."], ["d", "Obtain a left hip x-ray."]], "ans": ["d"], "rat": "The location of the client’s pain indicates a possible fractured hip and therefore an x-ray of the hip is needed. A leg cast is not appropriate and oxygen may not be needed. Medication to make the client more comfortable would likely be needed after a diagnosis is determined.", "topic": "Fracture, Assessment"}, {"module": 10, "ch": 47, "chTitle": "Concepts of Care for Patients With Musculoskeletal Trauma", "num": 4, "type": "Multiple Choice", "q": "The nurse is performing a neurovascular assessment for an older client who has an extremity fracture. How many seconds would the nurse expect for a capillary refill in it is within normal range?", "opts": [["a", "20 seconds"], ["b", "15 seconds"], ["c", "10 seconds"], ["d", "5 seconds"]], "ans": ["d"], "rat": "The normal capillary refill is usually 3 seconds, but for older adults, the refill usually takes up to 5 seconds due to vascular changes associated with aging.", "topic": "Fracture, Assessment"}, {"module": 10, "ch": 47, "chTitle": "Concepts of Care for Patients With Musculoskeletal Trauma", "num": 5, "type": "Multiple Choice", "q": "5. A nurse assesses an older adult who was admitted 2 days ago with a fractured hip. The nurse notes that the client is confused and restless with an oxygen saturation of 88%. Which action would the nurse take first?", "opts": [["a", "Administer oxygen via nasal cannula."], ["b", "Re-position to a semi-Fowler position."], ["c", "Increase the intravenous flow rate."], ["d", "Assess response to pain medication."]], "ans": ["a"], "rat": "The client is at high risk for a fat embolism syndrome and pulmonary embolus. Although these complications are life-threatening emergencies, the nurse would administer oxygen first and then notify the primary health care provider. Oxygen administration can reduce the risk for cerebral damage from hypoxia. Pain medication most likely would not cause the client to be restless.", "topic": "Fracture, Complications"}, {"module": 10, "ch": 47, "chTitle": "Concepts of Care for Patients With Musculoskeletal Trauma", "num": 6, "type": "Multiple Choice", "q": "A nurse is caring for several clients with fractures. Which client would the nurse identify as being at the highest risk for developing deep vein thrombosis?", "opts": [["a", "An 18-year-old male athlete with a fractured clavicle"], ["b", "A 36-year-old female with type 2 diabetes and fractured ribs"], ["c", "A 55-year-old female prescribed ibuprofen for osteoarthritis"], ["d", "A 74-year-old male who smokes and has a fractured pelvis"]], "ans": ["d"], "rat": "Deep vein thrombosis (DVT) as a complication with bone fractures occurs more often when fractures are sustained in the lower extremities and the client has additional risk factors for thrombus formation. Other risk factors include obesity, smoking, oral contraceptives, previous thrombus events, advanced age, venous stasis, and heart disease. The other clients do not have additional risk factors for DVT.", "topic": "Fracture, Complications"}, {"module": 10, "ch": 47, "chTitle": "Concepts of Care for Patients With Musculoskeletal Trauma", "num": 7, "type": "Multiple Choice", "q": "A nurse teaches assistive personnel (AP) about providing hygiene for a client in traction. Which statement would the nurse include as part of the teaching about this client’s care?", "opts": [["a", "“Remove the traction when re-positioning the client.”"], ["b", "“Assess the client’s skin when performing a bed bath.”"], ["c", "“Provide pin care by using alcohol wipes to clean the sites.”"], ["d", "“Ensure that the weights remain freely hanging at all times.”"]], "ans": ["d"], "rat": "Traction weights should be freely hanging at all times. They should not be lifted manually or allowed to rest on the floor. The client should remain in traction during hygiene activities. The nurse would assess the client’s skin and provide pin and wound care for a patient who is in traction; this would not be delegated to the AP.", "topic": "Fracture, Traction"}, {"module": 10, "ch": 47, "chTitle": "Concepts of Care for Patients With Musculoskeletal Trauma", "num": 8, "type": "Multiple Choice", "q": "A client is admitted to the emergency department with a fractured femur resulting from a motor vehicle crash. What the nurse’s priority action?", "opts": [["a", "Keep the client warm and comfortable."], ["b", "Assess airway, breathing, and circulation."], ["c", "Maintain the client in a supine position."], ["d", "Immobilize the injured extremity with a splint."]], "ans": ["b"], "rat": "As part of the primary survey, the nurse would ensure that the client does not have any life-threatening problem by assessing the ABCs first. If there are not major problems, then the nurse could attend to the injured extremity.", "topic": "Fracture, Complications"}, {"module": 10, "ch": 47, "chTitle": "Concepts of Care for Patients With Musculoskeletal Trauma", "num": 9, "type": "Multiple Choice", "q": "The nurse is caring for a client who had a closed reduction of the left arm and notes a large wet area of drainage on the cast. What action is the most important?", "opts": [["a", "Cut off the old cast."], ["b", "Document the assessment."], ["c", "Notify the primary health care provider."], ["d", "Wrap the cast with gauze."]], "ans": ["c"], "rat": "The primary health care provider should be notified to examine the client and determine the source of the drainage. The nurse’s assessment should be documented, but that is not the most important action.", "topic": "Fracture, Complications"}, {"module": 10, "ch": 47, "chTitle": "Concepts of Care for Patients With Musculoskeletal Trauma", "num": 10, "type": "Multiple Choice", "q": "A nurse is caring for a client who is recovering from an above-the-knee amputation and reports pain in the limb that was removed. How would the nurse respond?", "opts": [["a", "“The pain you are feeling does not actually exist.”"], ["b", "“This type of pain is common and will eventually go away.”"], ["c", "“Would you like to learn how to use imagery to minimize your pain?”"], ["d", "“How would you describe the pain that you are feeling?”"]], "ans": ["d"], "rat": "The nurse would ask the client to rate the pain on a scale of 0-10 and describe how the pain feels. Although phantom limb pain is common, the nurse would not minimize the pain that the client is experiencing by stating that it does not exist or will eventually go away. Although imagery may help, the nurse must assess the client’s pain before determining the best action.", "topic": ""}, {"module": 10, "ch": 47, "chTitle": "Concepts of Care for Patients With Musculoskeletal Trauma", "num": 11, "type": "Multiple Choice", "q": "A nurse cares for a client who had a wrist cast applied 3 days ago. The client states, “The cast is loose enough to slide off.” How would the nurse respond?", "opts": [["a", "“Keep your arm above the level of your heart.”"], ["b", "“As your muscles atrophy, the cast is expected to loosen.”"], ["c", "“I will wrap a bandage around the cast to prevent it from slipping.”"], ["d", "“You need a new cast now that the swelling is decreased.”"]], "ans": ["d"], "rat": "Often the surrounding soft tissues may be swollen considerably when the cast is initially applied. After the swelling has resolved, if the cast is loose enough to permit two or more fingers between the cast and the client’s skin, the cast needs to be replaced. Elevating the arm will not solve the problem, and the client’s muscles should not atrophy while in a cast for 6 weeks or less. An elastic bandage will not prevent slippage of the cast.", "topic": "Fracture, Casts"}, {"module": 10, "ch": 47, "chTitle": "Concepts of Care for Patients With Musculoskeletal Trauma", "num": 12, "type": "Multiple Choice", "q": "A nurse assesses a client with a pelvic fracture. Which assessment finding would the nurse identify as a complication of this injury?", "opts": [["a", "Hypertension"], ["b", "Diarrhea"], ["c", "Infection"], ["d", "Hematuria"]], "ans": ["d"], "rat": "The pelvis is very vascular and close to major organs. Injury to the pelvis can cause integral damage that may manifest as blood in the urine (hematuria) or stool. The nurse would also assess for signs of hemorrhage and hypovolemic shock, which include hypotension and tachycardia. Diarrhea and infection are not common complications of a pelvic fracture.", "topic": "Fracture, Complications"}, {"module": 10, "ch": 47, "chTitle": "Concepts of Care for Patients With Musculoskeletal Trauma", "num": 13, "type": "Multiple Choice", "q": "A nurse cares for a client placed in skeletal traction. The client asks, “What is the primary purpose of this type of traction?” How would the nurse respond?", "opts": [["a", "“Skeletal traction will assist in realigning your fractured bone.”"], ["b", "“This treatment will prevent future complications and back pain.”"], ["c", "“Traction decreases muscle spasms that occur with a fracture.”"], ["d", "“This type of traction minimizes damage as a result of fracture treatment.”"]], "ans": ["a"], "rat": "Skeletal traction pins or screws are surgically inserted into the bone to aid in bone alignment. As a last resort, traction can be used to relieve pain, decrease muscle spasm, and prevent or correct deformity and tissue damage. These are not primary purposes of skeletal traction.", "topic": "Fracture, Traction"}, {"module": 10, "ch": 47, "chTitle": "Concepts of Care for Patients With Musculoskeletal Trauma", "num": 14, "type": "Multiple Choice", "q": "The nurse is caring for a postoperative client who have a regional nerve blockade for a surgical tibial fracture repair this morning. What assessment finding would the nurse expect?", "opts": [["a", "Client reports nausea and vomiting."], ["b", "Client reports tingling in the surgical leg."], ["c", "Client responds well to imagery."], ["d", "Client reports little to no pain."]], "ans": ["d"], "rat": "A regional nerve blockade can last for about 24 hours so the client has little to no pain until it wears off. The blockade is localized and therefore does not cause nausea or vomiting.", "topic": "Fracture, Perioperative care"}, {"module": 10, "ch": 47, "chTitle": "Concepts of Care for Patients With Musculoskeletal Trauma", "num": 15, "type": "Multiple Choice", "q": "A nurse is caring for a client recovering from an above-the-knee amputation of the right leg. The client reports pain in the right foot. Which prescribed medication would the nurse most likely administer?", "opts": [["a", "Intravenous morphine"], ["b", "Oral acetaminophen"], ["c", "Intravenous calcitonin"], ["d", "Oral ibuprofen"]], "ans": ["c"], "rat": "The client is experiencing phantom limb pain, which usually manifests as intense burning, crushing, or cramping. IV infusions of calcitonin during the week after amputation can reduce phantom limb pain. Opioid analgesics such as morphine are not as effective for phantom limb pain as they are for residual limb pain. Oral acetaminophen and ibuprofen are not used in treating phantom limb pain.", "topic": "Amputation, Perioperative care"}, {"module": 10, "ch": 47, "chTitle": "Concepts of Care for Patients With Musculoskeletal Trauma", "num": 16, "type": "Multiple Choice", "q": "A nurse plans care for a client who is recovering from a below-the-knee amputation of the left leg. Which intervention would the nurse include in this client’s plan of care?", "opts": [["a", "Place pillows between the client’s knees."], ["b", "Encourage range-of-motion exercises."], ["c", "Administer prophylactic antibiotics."], ["d", "Implement strict bedrest in a supine position."]], "ans": ["b"], "rat": "Clients with a below-the-knee amputation should complete range-of-motion exercises to prevent flexion contractions and prepare for a prosthesis. A pillow may be used under the limb as support. Clients recovering from this type of amputation are at low risk for infection and should not be prescribed prophylactic antibiotics. The client should be encouraged to re-position, move, and exercise frequently, and therefore should not be restricted to bedrest.", "topic": "Amputation, Perioperative care"}, {"module": 10, "ch": 47, "chTitle": "Concepts of Care for Patients With Musculoskeletal Trauma", "num": 17, "type": "Multiple Choice", "q": "The nurse is teaching a client how to use a cane after a right surgical fractured fibula repair. What health teaching would the nurse include?", "opts": [["a", "“Place the cane on your left side.”"], ["b", "“Move the cane and your left leg at the same time.”"], ["c", "“Be sure the cane is parallel to your waist.”"], ["d", "“Use the cane only when your right leg is painful.”"]], "ans": ["a"], "rat": "The cane should be placed on the unaffected side (left for this client) and moved forward with the injured leg (right for this client) to provide support. The cane should be parallel to the stylus of the wrist and used at all times when ambulating.", "topic": "Fracture, Rehabilitation"}, {"module": 10, "ch": 47, "chTitle": "Concepts of Care for Patients With Musculoskeletal Trauma", "num": 18, "type": "Multiple Choice", "q": "A nurse is caring for a client with diabetes mellitus who has fractured her arm. Which action would the nurse take first?", "opts": [["a", "Remove the medical alert bracelet from the fractured arm."], ["b", "Immobilize the arm by splinting the fractured site."], ["c", "Place the client in a supine position with a warm blanket."], ["d", "Cover any open areas with a sterile dressing."]], "ans": ["a"], "rat": "A client’s medical alert bracelet or any other jewelry would be removed from the fractured arm before the affected extremity swells. Immobilization, positioning, and dressing should occur after the bracelet is removed.", "topic": "Fracture, Management"}, {"module": 10, "ch": 47, "chTitle": "Concepts of Care for Patients With Musculoskeletal Trauma", "num": 19, "type": "Multiple Choice", "q": "A nurse cares for a client with a recently fractured tibia. Which assessment would alert the nurse to take immediate action?", "opts": [["a", "Pain of 4 on a scale of 0-10"], ["b", "Numbness in the extremity"], ["c", "Swollen extremity at the injury site"], ["d", "Feeling cold while lying in bed"]], "ans": ["b"], "rat": "The client with numbness and/or tingling of the extremity may be displaying the first signs of acute compartment syndrome. This is an acute problem that requires immediate intervention because of possible decreased circulation. Moderate pain and swelling is an expected assessment after a fracture. These findings can be treated with comfort measures. Being cold can be treated with additional blankets or by increasing the temperature of the room.", "topic": "Fracture, Complications"}, {"module": 10, "ch": 47, "chTitle": "Concepts of Care for Patients With Musculoskeletal Trauma", "num": 20, "type": "Multiple Choice", "q": "After teaching a client with a fractured humerus, the nurse assesses the client’s understanding. Which dietary choice demonstrates that the client correctly understands the nutrition needed to assist in healing the fracture?", "opts": [["a", "Baked fish with orange juice and a vitamin D supplement"], ["b", "Bacon, lettuce, and tomato sandwich with a vitamin B supplement"], ["c", "Vegetable lasagna with a green salad and a vitamin A supplement"], ["d", "Roast beef with low-fat milk and a vitamin C supplement"]], "ans": ["d"], "rat": "The client with a healing fracture needs supplements of vitamins B and C and a high-protein, high-calorie diet. Milk for calcium supplementation and vitamin C supplementation is appropriate. Meat would increase protein in the diet that is necessary for bone healing. Fish, a sandwich, and vegetable lasagna would provide less protein.", "topic": "Fracture, Health promotion"}, {"module": 10, "ch": 47, "chTitle": "Concepts of Care for Patients With Musculoskeletal Trauma", "num": 21, "type": "Multiple Choice", "q": "A client who had a traumatic above-the-knee amputation states that he fears he will never have an intimate relationship again. What is the nurse’s best response?", "opts": [["a", "“You’ll be able to get a leg prosthesis soon.”"], ["b", "“You think you won’t be able to have sex again?”"], ["c", "“I will ask the social worker to talk with you.”"], ["d", "“Are you married now or have a girl friend?”"]], "ans": ["b"], "rat": "The nurse’s response needs to allow further exploration of the client’s feelings. Referring the client to another health professional might be appropriate at a later time but discounts the client’s current feelings. Asking about marriage or a girlfriend assumes that the client is heterosexual.", "topic": "Amputation, Psychosocial assessment"}, {"module": 10, "ch": 47, "chTitle": "Concepts of Care for Patients With Musculoskeletal Trauma", "num": 22, "type": "Multiple Choice", "q": "A nurse is caring for an older client who is recovering from a leg amputation surgery. The client states, “I don’t want to live with only one leg. I should have died during the surgery.” What is the nurse’s best response?", "opts": [["a", "“Your vital signs are good, and you are doing just fine right now.”"], ["b", "“Your children are waiting outside. Do you want them to grow up without a father?”"], ["c", "“This is a big change for you. What support system do you have to help you cope?”"], ["d", "“You will be able to do some of the same things as before you became disabled.”"]], "ans": ["c"], "rat": "The client feels like less of a person following the amputation. The nurse would help the client to identify coping mechanisms that have worked in the past and current support systems to assist with coping. The nurse would not ignore the client’s feelings by focusing on vital signs. The nurse would not try to make the client feel guilty by alluding to family members. The nurse would not refer to the patient as being “disabled” as this labels the client and may fuel poor body image.", "topic": "Amputation | Psychosocial assessment"}, {"module": 10, "ch": 47, "chTitle": "Concepts of Care for Patients With Musculoskeletal Trauma", "num": 23, "type": "Multiple Choice", "q": "After teaching a client who is recovering from a vertebroplasty, the nurse assesses the patient’s understanding. Which statement by the client indicates a need for additional teaching?", "opts": [["a", "“I can drive myself home after the procedure.”"], ["b", "“I will monitor the puncture site for signs of infection.”"], ["c", "“I can start walking tomorrow and increase my activity slowly.”"], ["d", "“I will remove the dressing the day after discharge.”"]], "ans": ["a"], "rat": "Before discharge, a client who has a vertebroplasty would be taught to avoid driving or operating machinery for the first 24 hours. The client should monitor the puncture site for signs of infection. Usual activities can resume slowly, including walking and slowly increasing activity over the next few days. The client should keep the dressing dry and remove it the next day.", "topic": "Fracture, Perioperative care"}, {"module": 10, "ch": 47, "chTitle": "Concepts of Care for Patients With Musculoskeletal Trauma", "num": 24, "type": "Multiple Choice", "q": "A nurse plans care for a client who has an external fixator on the lower leg. Which intervention would the nurse include in the plan of care to decrease the client’s risk for infection?", "opts": [["a", "Washing the frame of the fixator once a day"], ["b", "Releasing fixator tension for 30 minutes twice a day"], ["c", "Avoiding moving the extremity by holding the fixator"], ["d", "Scheduling for pin care to be provided every shift"]], "ans": ["d"], "rat": "To decrease the risk for infection in a client with skeletal traction or external fixation, the nurse would provide routine pin care and assess for signs and symptoms of infection at the pin sites every shift.", "topic": "Fracture, External fixator"}, {"module": 10, "ch": 47, "chTitle": "Concepts of Care for Patients With Musculoskeletal Trauma", "num": 1, "type": "Multiple Response", "q": "A nurse teaches a client with a fractured tibia about external fixation. Which advantages of external fixation for the immobilization of fractures would the nurse share with the client? (Select all that apply.)", "opts": [["a", "It leads to minimal blood loss."], ["b", "It allows for early ambulation."], ["c", "It decreases the risk of infection."], ["d", "It increases blood supply to tissues."], ["e", "It promotes healing."]], "ans": ["a", "b", "e"], "rat": "External fixation is a system in which pins or wires are inserted through the skin and bone and then connected to a ridged external frame. With external fixation, blood loss is less than with internal fixation, but the risk for infection is much higher. The device allows early ambulation and exercise, maintains alignment, stabilizes the fracture site, and promotes healing. The device does not increase blood supply to the tissues. The nurse would assess for distal circulation, movement, and sensation, which can be disturbed by fracture injuries and treatments.", "topic": "Fracture, External fixator"}, {"module": 10, "ch": 47, "chTitle": "Concepts of Care for Patients With Musculoskeletal Trauma", "num": 2, "type": "Multiple Response", "q": "The nurse assesses a client who is admitted with a pelvic fracture. Which assessments would the nurse monitor to prevent or detect a complication of this injury? (Select all that apply.)", "opts": [["a", "Temperature"], ["b", "Urinary output"], ["c", "Blood pressure"], ["d", "Pupil reaction"], ["e", "Skin color"]], "ans": ["b", "c", "e"], "rat": "With a pelvic fracture, internal organ damage may result in bleeding and hypovolemic shock. The nurse monitors the client’s heart rate, blood pressure, urine output, skin color, and level of consciousness frequently to detect assess for shock. It is important to monitor the urine for blood to assess whether the urinary system has been damaged with the pelvic fracture. Changes in temperature and pupil reactions are not directly associated with hypovolemic shock. Temperature changes are usually associated with hypo- or hyperthermia or infectious processes. Pupillary changes occur with brain injuries, bleeds, or strokes.", "topic": "Fracture, Complications"}, {"module": 10, "ch": 47, "chTitle": "Concepts of Care for Patients With Musculoskeletal Trauma", "num": 3, "type": "Multiple Response", "q": "The nurse is caring for a client who recently sustained a sports injury to his right leg. What nursing interventions are appropriate for this client? (Select all that apply.)", "opts": [["a", "Immobilize the right leg."], ["b", "Apply heat immediately after the injury."], ["c", "Use compression to support the leg."], ["d", "Obtain an x-ray to detect possible fracture."], ["e", "Elevate the right leg to decrease swelling."], ["f", "Administer an opioid every 4 to 6 hours."]], "ans": ["a", "c", "d", "e"], "rat": "The client who experiences a sports injury should be managed using the RICE treatment plan. Rest, ice, compression, and elevation are all appropriate. Heat would increase swelling and probably pain. An x-ray would be obtained to determine if one or more fractures are present. Opioids may not be needed depending on the nature of the injury.", "topic": "Sports injury, Management"}, {"module": 10, "ch": 47, "chTitle": "Concepts of Care for Patients With Musculoskeletal Trauma", "num": 4, "type": "Multiple Response", "q": "A nurse plans care for a client who is recovering from open reduction and internal fixation (ORIF) surgery for a right hip fracture. Which interventions would the nurse include in this client’s plan of care? (Select all that apply.)", "opts": [["a", "Elevate heels off the bed with a pillow."], ["b", "Ambulate the client on the first postoperative day."], ["c", "Push the client’s patient-controlled analgesia button."], ["d", "Re-position the client every 2 hours."], ["e", "Use pillows to encourage subluxation of the hip."]], "ans": ["a", "b", "d"], "rat": "Postoperative care for a client who has ORIF of the hip includes elevating the client’s heels off the bed and re-positioning every 2 hours to prevent pressure and skin breakdown. It also includes ambulating the client on the first postoperative day, and using pillows or an abduction pillow to prevent subluxation of the hip. The nurse would teach the client to use the patient-controlled analgesia pump, but the nurse would never push the button for the client.", "topic": "Fracture, Perioperative nursing"}, {"module": 10, "ch": 47, "chTitle": "Concepts of Care for Patients With Musculoskeletal Trauma", "num": 5, "type": "Multiple Response", "q": "A nurse teaches a client who is at risk for carpal tunnel syndrome. Which health promotion activities would the nurse include in the health teaching? (Select all that apply.)", "opts": [["a", "“Frequently assesses the ergonomics of the equipment being used.”"], ["b", "“Take breaks to stretch fingers and wrists during working hours.”"], ["c", "“Do not participate in activities that require repetitive actions.”"], ["d", "“Take ibuprofen to decrease pain and swelling in wrists.”"], ["e", "“Adjust chair height to allow for good posture.”"]], "ans": ["a", "b", "e"], "rat": "Health promotion activities to prevent carpal tunnel syndrome include assessing the ergonomics of the equipment being used, taking breaks to stretch fingers and wrists during working hours, and adjusting chair height to allow for good posture. The client should be allowed to participate in activities that require repetitive actions as long as precautions are taken to promote health. Pain medications are not part of health promotion activities.", "topic": "Musculoskeletal injury, Health teaching"}, {"module": 10, "ch": 47, "chTitle": "Concepts of Care for Patients With Musculoskeletal Trauma", "num": 6, "type": "Multiple Response", "q": "A nurse teaches a client about prosthesis care after amputation. Which statements would the nurse include in the health teaching? (Select all that apply.)", "opts": [["a", "“The device has been custom made specifically for you.”"], ["b", "“Your prosthetic is good for work but not for exercising.”"], ["c", "“A prosthetist will clean your inserts for you each month.”"], ["d", "“Make sure that you wear the correct liners with your prosthetic.”"], ["e", "“I have scheduled a follow-up appointment for you.”"]], "ans": ["a", "d", "e"], "rat": "A client with a new prosthetic should be taught that the prosthetic device is custom made for the client, taking into account the level of amputation, lifestyle (including exercise preferences), and occupation. In collaboration with a prosthetist, the client should be taught proper techniques for cleansing the sockets and inserts, wearing the correct liners, and assessing shoe wear. Follow-up care and appointments are important for ongoing assessment.", "topic": "Amputation, Health teaching"}, {"module": 10, "ch": 47, "chTitle": "Concepts of Care for Patients With Musculoskeletal Trauma", "num": 7, "type": "Multiple Response", "q": "The nurse is caring for a client who just had a kyphoplasty. What nursing care is needed for the client at this time? (Select all that apply.)", "opts": [["a", "Place the client in a prone position to prevent pressure on the surgical area."], ["b", "Apply an ice pack to the surgical area to help relieve pain."], ["c", "Assess the client’s pain level to compare it with pain before the procedure."], ["d", "Take vital signs, including oxygen saturation, frequently."], ["e", "Monitor for complications such as bleeding or shortness of breath."], ["f", "Perform frequent neurologic assessments and report major changes."]], "ans": ["b", "c", "d", "e", "f"], "rat": "All of the choices are correct except that the client should stay in a flat supine position immediately after the procedure.", "topic": "Fracture, Perioperative care"}];
const MODS={6:"Module 6 · Inflammation & Immunity",10:"Module 10 · Musculoskeletal"};
let S={mod:6,ch:"all",filt:"all",i:0,flipped:false,order:null,prog:{}};
const $=id=>document.getElementById(id);
const key=c=>c.ch+"-"+c.type[9]+c.num;
try{const p=JSON.parse(localStorage.getItem("medsurg_prog")||"{}");if(p&&typeof p==="object")S.prog=p}catch(e){}
function save(){try{localStorage.setItem("medsurg_prog",JSON.stringify(S.prog))}catch(e){}}
try{const t=localStorage.getItem("medsurg_theme");if(t)document.documentElement.dataset.theme=t}catch(e){}
function esc(s){return s.replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]))}
function deck(){
 let d=DATA.filter(c=>c.module===S.mod&&(S.ch==="all"||c.ch==+S.ch));
 d=d.filter(c=>{const p=S.prog[key(c)];return S.filt==="all"||(S.filt==="new"&&!p)||p===S.filt});
 if(S.order){const o=S.order;d.sort((a,b)=>(o[key(a)]??0)-(o[key(b)]??0))}
 return d}
function head(){
 $("mods").innerHTML=Object.keys(MODS).map(m=>`<button data-m="${m}" class="${S.mod==m?'on':''}">${MODS[m]}</button>`).join("");
 $("mods").querySelectorAll("button").forEach(b=>b.onclick=()=>{S.mod=+b.dataset.m;S.ch="all";S.i=0;S.flipped=false;render()});
 const chs=[...new Map(DATA.filter(c=>c.module===S.mod).map(c=>[c.ch,c.chTitle])).entries()];
 $("chap").innerHTML=`<option value="all">All chapters</option>`+chs.map(([n,t])=>`<option value="${n}">Ch ${n}: ${esc(t)}</option>`).join("");
 $("chap").value=S.ch;$("filt").value=S.filt}
function render(){
 head();const d=deck();if(S.i>=d.length)S.i=Math.max(0,d.length-1);
 const all=DATA.filter(c=>c.module===S.mod&&(S.ch==="all"||c.ch==+S.ch));
 const k=all.filter(c=>S.prog[key(c)]==="known").length,r=all.filter(c=>S.prog[key(c)]==="review").length;
 $("pb").style.width=(all.length?k/all.length*100:0)+"%";
 $("stat").textContent=`✓ ${k} known · ✗ ${r} review · ${all.length} total`;
 if(!d.length){$("stage").innerHTML=`<div class="card empty">No cards match this filter.</div>`;$("pos").textContent="0 / 0";return}
 const c=d[S.i];$("pos").textContent=`Card ${S.i+1} / ${d.length}`;
 const right=new Set(c.ans);
 if(!S.flipped){
  $("stage").innerHTML=`<div class="card" id="cd"><span class="tag">Ch ${c.ch} · ${c.type}</span><p class="q">${esc(c.q)}</p>${c.opts.map(o=>`<div class="opt"><b>${o[0]}.</b><span>${esc(o[1])}</span></div>`).join("")}<div class="hint">Tap card to reveal answer</div></div>`;
 }else{
  $("stage").innerHTML=`<div class="card" id="cd"><span class="tag">Answer</span><p class="q">${esc(c.q)}</p>${c.opts.map(o=>`<div class="opt ${right.has(o[0])?'right':''}"><b>${o[0]}.</b><span>${esc(o[1])}</span></div>`).join("")}<div class="ans">Correct: ${c.ans.map(a=>a.toUpperCase()).join(", ")}</div><p class="rat">${esc(c.rat)}</p><div class="topic">${esc(c.topic)}</div></div>`;
 }
 $("cd").onclick=()=>{S.flipped=!S.flipped;render()}}
function go(n){const d=deck();if(!d.length)return;S.i=(S.i+n+d.length)%d.length;S.flipped=false;render()}
function mark(v){const d=deck();if(!d.length)return;S.prog[key(d[S.i])]=v;save();
 if(S.filt!=="all"&&S.filt!==v){S.flipped=false;render()}else go(1)}
$("prev").onclick=()=>go(-1);$("next").onclick=()=>go(1);
$("flip").onclick=()=>{S.flipped=!S.flipped;render()};
$("got").onclick=()=>mark("known");$("rev").onclick=()=>mark("review");
$("chap").onchange=e=>{S.ch=e.target.value;S.i=0;S.flipped=false;render()};
$("filt").onchange=e=>{S.filt=e.target.value;S.i=0;S.flipped=false;render()};
$("shuf").onclick=()=>{S.order={};DATA.forEach(c=>S.order[key(c)]=Math.random());S.i=0;S.flipped=false;render()};
$("reset").onclick=()=>{if(confirm("Reset all progress?")){S.prog={};save();S.i=0;render()}};
$("theme").onclick=()=>{const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;r.dataset.theme=dark?"light":"dark";try{localStorage.setItem("medsurg_theme",r.dataset.theme)}catch(e){}};
document.addEventListener("keydown",e=>{if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);else if(e.key===" "){e.preventDefault();S.flipped=!S.flipped;render()}});
render();
</script></body></html>
